<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILLER AMONG US — Match</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>FULL TILT PRESENTS</small><h1>KILLER <span>AMONG US</span></h1></div><div class="status"><b id="round">ROUND —</b><span id="serverState">CONNECTING…</span></div></header>
<main><section class="board-wrap"><div class="board" id="board"></div><div class="card"><div class="card-head"><h3>PLAYERS</h3><b id="turnOwner"></b></div><div id="players" class="players"></div></div></section><aside>
<div class="card role"><small>PRIVATE ROLE</small><h2 id="roleTitle">—</h2><p id="roleText"></p></div>
<div class="card"><div class="card-head"><h3>YOUR STATUS</h3><b id="location">—</b></div><p id="turnText"></p><div class="actions"><button id="rollBtn">🎲 ROLL MOVEMENT</button><button id="searchBtn">🔎 SEARCH FOR EVIDENCE</button><button id="suggestBtn">🕵️ MAKE SUGGESTION</button><button id="doorsBtn">🚪 FLIP SECURITY</button><button id="passagesBtn">◈ FLIP PASSAGES</button><button id="accuseBtn" class="danger">⚠ ACCUSE</button><button id="endBtn" class="secondary">END TURN</button></div><div id="result" class="result"></div></div>
<div class="card"><div class="card-head"><h3>PRIVATE HAND</h3><b id="handCount"></b></div><div id="hand"></div></div>
<div class="card"><div class="card-head"><h3>PRIVATE EVIDENCE</h3><b id="evidenceCount"></b></div><div id="evidence"></div></div>
<div class="card"><div class="card-head"><h3>SUGGESTION HISTORY</h3><b id="historyCount"></b></div><div id="history"></div></div>
<div class="card"><div class="card-head"><h3>PUBLIC CASE BOARD</h3><b id="publicCount"></b></div><div id="publicBoard"></div></div>
</aside></main>
<div id="suggestModal" class="modal hidden"><div class="modal-card"><small>PRIVATE DEDUCTION</small><h2>MAKE A SUGGESTION</h2><label>WHO?</label><select id="suspectSelect"></select><label>WITH WHAT?</label><select id="weaponSelect"></select><div class="actions"><button id="submitSuggest">SUBMIT</button><button id="cancelSuggest" class="secondary">CANCEL</button></div></div></div>
<div id="accuseModal" class="modal hidden"><div class="modal-card"><small>FINAL THEORY</small><h2 id="accuseTitle">MAKE AN ACCUSATION</h2><label>WHO?</label><select id="accuseSuspect"></select><label>WITH WHAT?</label><select id="accuseWeapon"></select><label>WHERE?</label><select id="accuseRoom"></select><div class="actions"><button id="submitAccuse" class="danger">COMMIT</button><button id="cancelAccuse" class="secondary">CANCEL</button></div></div></div>
<script src="game.js"></script></body></html>
