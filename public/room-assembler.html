<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0c11" />
<title>KAU Room Assembler</title>
<style>
:root{--bg:#0b0c11;--panel:#14161f;--panel2:#1b1e29;--gold:#e6be5a;--cyan:#82d2e6;--text:#f4f1e8;--muted:#a7aab7;--danger:#ff5b66;--ok:#42d392}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}button,input,select{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0d0f15;border-bottom:1px solid #272a35;min-height:52px;overflow-x:auto}.brand{font-weight:900;white-space:nowrap;color:var(--gold);margin-right:4px}.roomSel{min-width:158px;background:var(--panel2);color:var(--text);border:1px solid #343845;border-radius:10px;padding:8px 10px}.pill{border:1px solid #343845;background:var(--panel);color:var(--text);border-radius:10px;padding:8px 10px;white-space:nowrap}.pill.on{border-color:var(--gold);box-shadow:0 0 0 1px #e6be5a55 inset}.pill.danger{color:#ffd6da}.spacer{flex:1}
.workspace{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 45%,#1d2029 0,#0a0b10 68%)}canvas{position:absolute;left:0;top:0;touch-action:none}.hud{position:absolute;left:8px;top:8px;background:#0b0c11cc;border:1px solid #343845;border-radius:10px;padding:7px 9px;font-size:12px;color:var(--muted);pointer-events:none}.hud b{color:var(--text)}
.bottom{background:#0d0f15;border-top:1px solid #272a35;padding:8px;display:grid;gap:8px}.row{display:flex;gap:7px;align-items:center;overflow-x:auto}.tool{min-width:48px;border:1px solid #343845;background:var(--panel);color:var(--text);border-radius:10px;padding:9px 10px}.tool:active{transform:scale(.97)}.tool.primary{border-color:var(--gold);color:#fff1b7}.tool.active{background:#24283a;border-color:var(--cyan)}.tool:disabled{opacity:.35}.range{width:130px}.label{font-size:12px;color:var(--muted);white-space:nowrap}.fileBtn{position:relative;overflow:hidden}.fileBtn input{position:absolute;inset:0;opacity:0;font-size:40px;cursor:pointer}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(122px + env(safe-area-inset-bottom));background:#10121aeF;border:1px solid #343845;border-radius:14px;padding:10px;display:none;max-height:44vh;overflow:auto;z-index:4}.sheet.show{display:block}.sheet h3{margin:0 0 8px;font-size:14px}.small{font-size:12px;color:var(--muted)}.objectList{display:grid;gap:6px}.objRow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 8px;background:#181b25;border-radius:9px}.objRow.sel{outline:1px solid var(--cyan)}.objName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini{padding:5px 8px;border:1px solid #343845;background:#0f1118;color:var(--text);border-radius:7px}
.toast{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:#11141de8;border:1px solid #3d4251;border-radius:999px;padding:8px 12px;font-size:12px;opacity:0;transition:.2s;z-index:6;pointer-events:none}.toast.show{opacity:1}
@media(min-width:900px){.bottom{grid-template-columns:1fr auto}.sheet{left:auto;width:340px;top:70px;bottom:auto;right:10px;max-height:70vh}.top{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">KAU ROOM ASSEMBLER</div>
    <select id="roomSelect" class="roomSel"></select>
    <button id="guidesBtn" class="pill on">Door guides</button>
    <button id="snapBtn" class="pill on">Snap</button>
    <button id="fitBtn" class="pill">Fit</button>
    <div class="spacer"></div>
    <button id="objectsBtn" class="pill">Objects</button>
  </div>
  <div id="workspace" class="workspace">
    <canvas id="canvas"></canvas>
    <div class="hud"><b id="roomName">Vault</b> · <span id="footprint">5×5</span><br><span id="entryText">Entries: E + S</span></div>
    <div id="toast" class="toast"></div>
    <div id="sheet" class="sheet"><h3>Objects</h3><div id="objectList" class="objectList"></div><p class="small">Tap an item to select it. Use the controls below to scale, rotate, flip, layer, duplicate, or delete.</p></div>
  </div>
  <div class="bottom">
    <div class="row">
      <label class="tool primary fileBtn">+ Furniture<input id="fileInput" type="file" accept="image/png,image/webp,image/jpeg" multiple></label>
      <button id="duplicateBtn" class="tool">Duplicate</button>
      <button id="frontBtn" class="tool">Front</button><button id="backBtn" class="tool">Back</button>
      <button id="rotLBtn" class="tool">↺ 15°</button><button id="rotRBtn" class="tool">↻ 15°</button>
      <button id="flipBtn" class="tool">Flip</button><button id="deleteBtn" class="tool danger">Delete</button>
    </div>
    <div class="row">
      <span class="label">Scale</span><input id="scaleRange" class="range" type="range" min="10" max="300" value="100">
      <button id="saveBtn" class="tool">Save</button><button id="loadBtn" class="tool fileBtn">Load<input id="loadInput" type="file" accept="application/json"></button>
      <button id="exportBtn" class="tool primary">Export PNG</button>
    </div>
  </div>
</div>
<script>
const PRESETS={
'Vault':{base:'5x5',entries:['E','S']},
'Control Room':{base:'6x5',entries:['W','S','E']},
'High Roller':{base:'5x5',entries:['W','S']},
'Afterhours':{base:'6x5',entries:['N','E','S']},
'Casino Floor':{base:'5x5',entries:['N','E','S','W']},
'Kitchen':{base:'6x5',entries:['N','W','S']},
'Workshop':{base:'5x5',entries:['N','E']},
'Back Office':{base:'6x5',entries:['N','W','E']},
'Back Room':{base:'5x5',entries:['N','W']}
};
const BASES={
'5x5':{w:1340,h:812,cols:5,rows:5,left:[90,405.80],dx:115.966,dy:63.159},
'6x5':{w:1456,h:875,cols:6,rows:5,left:[90,468.96],dx:115.966,dy:63.159}
};
const $=id=>document.getElementById(id); const cvs=$('canvas'),ctx=cvs.getContext('2d'); const ws=$('workspace');
let room='Vault',objects=[],selected=-1,guides=true,snap=true,view={scale:1,ox:0,oy:0},drag=null,pointers=new Map(),pinch=null;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1300)}
function preset(){return PRESETS[room]} function base(){return BASES[preset().base]}
function setupRooms(){for(const n of Object.keys(PRESETS)){const o=document.createElement('option');o.value=n;o.textContent=n;$('roomSelect').appendChild(o)}$('roomSelect').value=room}
function loadBase(){fit();return Promise.resolve()}
function resize(){const r=ws.getBoundingClientRect();cvs.width=Math.round(r.width*devicePixelRatio);cvs.height=Math.round(r.height*devicePixelRatio);cvs.style.width=r.width+'px';cvs.style.height=r.height+'px';draw()}
function fit(){const r=ws.getBoundingClientRect(),b=base();view.scale=Math.min((r.width-24)/b.w,(r.height-24)/b.h);view.ox=(r.width-b.w*view.scale)/2;view.oy=(r.height-b.h*view.scale)/2;draw()}
function screenToWorld(sx,sy){return{x:(sx-view.ox)/view.scale,y:(sy-view.oy)/view.scale}}
function worldToScreen(x,y){return{x:view.ox+x*view.scale,y:view.oy+y*view.scale}}
function cellPoly(r,c,b=base()){const [lx,ly]=b.left,dx=b.dx,dy=b.dy;const V=(rr,cc)=>[lx+(rr+cc)*dx,ly+(rr-cc)*dy];return[V(r,c),V(r,c+1),V(r+1,c+1),V(r+1,c)]}
function tileCenters(b=base()){const arr=[];for(let r=0;r<b.rows;r++)for(let c=0;c<b.cols;c++){const p=cellPoly(r,c,b);arr.push({r,c,x:p.reduce((s,q)=>s+q[0],0)/4,y:p.reduce((s,q)=>s+q[1],0)/4})}return arr}
function entryCells(side,b=base()){let cells=[];const centerIdx=(n)=>n%2?[Math.floor(n/2)]:[n/2-1,n/2];if(side==='N')for(const c of centerIdx(b.cols))cells.push([0,c]);if(side==='S')for(const c of centerIdx(b.cols))cells.push([b.rows-1,c]);if(side==='W')for(const r of centerIdx(b.rows))cells.push([r,0]);if(side==='E')for(const r of centerIdx(b.rows))cells.push([r,b.cols-1]);return cells}
function inwardCell(side,r,c,b=base()){if(side==='N')return[Math.min(r+1,b.rows-1),c];if(side==='S')return[Math.max(r-1,0),c];if(side==='W')return[r,Math.min(c+1,b.cols-1)];return[r,Math.max(c-1,0)]}
function drawGuides(){if(!guides)return;ctx.save();ctx.globalAlpha=.78;for(const side of preset().entries){for(const [r,c] of entryCells(side)){fillPoly(cellPoly(r,c),'rgba(255,70,75,.55)','rgba(255,120,120,.9)');const [rr,cc]=inwardCell(side,r,c);fillPoly(cellPoly(rr,cc),'rgba(250,205,45,.32)','rgba(255,220,80,.65)')}}ctx.restore()}
function fillPoly(poly,fill,stroke){ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i][0],poly[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2/view.scale;ctx.stroke()}
function drawBase(target,b=base()){target.save();target.beginPath();const [lx,ly]=b.left,dx=b.dx,dy=b.dy,V=(r,c)=>[lx+(r+c)*dx,ly+(r-c)*dy];const corners=[V(0,0),V(0,b.cols),V(b.rows,b.cols),V(b.rows,0)];target.moveTo(corners[0][0],corners[0][1]);corners.slice(1).forEach(q=>target.lineTo(q[0],q[1]));target.closePath();target.fillStyle='#202026';target.fill();target.strokeStyle='#e6be5a';target.lineWidth=3;target.stroke();target.strokeStyle='#82d2e6';target.lineWidth=2;target.globalAlpha=.7;for(let r=0;r<=b.rows;r++){const a=V(r,0),z=V(r,b.cols);target.beginPath();target.moveTo(a[0],a[1]);target.lineTo(z[0],z[1]);target.stroke()}for(let c=0;c<=b.cols;c++){const a=V(0,c),z=V(b.rows,c);target.beginPath();target.moveTo(a[0],a[1]);target.lineTo(z[0],z[1]);target.stroke()}target.globalAlpha=1;target.fillStyle='#ffdc78';for(const p of tileCenters(b)){target.beginPath();target.arc(p.x,p.y,4,0,Math.PI*2);target.fill()}target.restore()}
function draw(){const dpr=devicePixelRatio;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cvs.width/dpr,cvs.height/dpr);ctx.save();ctx.translate(view.ox,view.oy);ctx.scale(view.scale,view.scale);drawBase(ctx);drawGuides();objects.forEach((o,i)=>drawObj(o,i===selected));ctx.restore();updateUI()}
function drawObj(o,sel){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.scale(o.flip?-o.scale:o.scale,o.scale);ctx.drawImage(o.img,-o.w/2,-o.h/2,o.w,o.h);if(sel){ctx.strokeStyle='#82d2e6';ctx.lineWidth=3/(view.scale*Math.max(o.scale,.01));ctx.setLineDash([12,8]);ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h)}ctx.restore()}
function objectAt(x,y){for(let i=objects.length-1;i>=0;i--){const o=objects[i],dx=x-o.x,dy=y-o.y,cs=Math.cos(-o.rot),sn=Math.sin(-o.rot),lx=(dx*cs-dy*sn)/o.scale,ly=(dx*sn+dy*cs)/o.scale;if(Math.abs(lx)<=o.w/2&&Math.abs(ly)<=o.h/2)return i}return -1}
function maybeSnap(o){if(!snap)return;let best=null,bd=Infinity;for(const p of tileCenters()){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;best=p}}if(best&&bd<80){o.x=best.x;o.y=best.y}}
function addFiles(files){[...files].forEach(f=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const b=base(),max=Math.min(b.w,b.h)*.32,k=Math.min(1,max/Math.max(img.width,img.height));objects.push({name:f.name,img,src:e.target.result,x:b.w/2,y:b.h/2,w:img.width*k,h:img.height*k,scale:1,rot:0,flip:false});selected=objects.length-1;draw();refreshList()};img.src=e.target.result};rd.readAsDataURL(f)})}
function updateUI(){const p=preset();$('roomName').textContent=room;$('footprint').textContent=p.base.replace('x','×');$('entryText').textContent='Entries: '+p.entries.join(' + ');$('guidesBtn').classList.toggle('on',guides);$('snapBtn').classList.toggle('on',snap);$('scaleRange').value=selected>=0?Math.round(objects[selected].scale*100):100;['duplicateBtn','frontBtn','backBtn','rotLBtn','rotRBtn','flipBtn','deleteBtn'].forEach(id=>$(id).disabled=selected<0)}
function refreshList(){const box=$('objectList');box.innerHTML='';objects.forEach((o,i)=>{const row=document.createElement('div');row.className='objRow'+(i===selected?' sel':'');row.innerHTML=`<div class="objName">${escapeHtml(o.name)}</div><button class="mini">Select</button><button class="mini">×</button>`;row.children[1].onclick=()=>{selected=i;draw();refreshList()};row.children[2].onclick=()=>{objects.splice(i,1);if(selected>=objects.length)selected=objects.length-1;draw();refreshList()};box.appendChild(row)})}
function escapeHtml(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function duplicate(){if(selected<0)return;const o=objects[selected];objects.push({...o,x:o.x+25,y:o.y+25});selected=objects.length-1;draw();refreshList()}
function exportPNG(){const b=base(),oc=document.createElement('canvas');oc.width=b.w;oc.height=b.h;const c=oc.getContext('2d');c.clearRect(0,0,b.w,b.h);drawBase(c,b);objects.forEach(o=>{c.save();c.translate(o.x,o.y);c.rotate(o.rot);c.scale(o.flip?-o.scale:o.scale,o.scale);c.drawImage(o.img,-o.w/2,-o.h/2,o.w,o.h);c.restore()});oc.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=room.toLowerCase().replace(/\s+/g,'_')+'_furnished.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
function saveJSON(){const data={version:1,room,objects:objects.map(o=>({name:o.name,src:o.src,x:o.x,y:o.y,w:o.w,h:o.h,scale:o.scale,rot:o.rot,flip:o.flip}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=room.toLowerCase().replace(/\s+/g,'_')+'_layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadJSON(file){try{const data=JSON.parse(await file.text());room=data.room in PRESETS?data.room:room;$('roomSelect').value=room;objects=[];await loadBase();for(const d of data.objects||[]){await new Promise(res=>{const img=new Image();img.onload=()=>{objects.push({...d,img});res()};img.src=d.src})}selected=objects.length?objects.length-1:-1;fit();refreshList();toast('Layout loaded')}catch(e){toast('Could not load layout')}}

cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);const rect=cvs.getBoundingClientRect(),sx=e.clientX-rect.left,sy=e.clientY-rect.top;pointers.set(e.pointerId,{x:sx,y:sy});if(pointers.size===1){const w=screenToWorld(sx,sy),hit=objectAt(w.x,w.y);selected=hit;if(hit>=0){const o=objects[hit];drag={id:e.pointerId,type:'obj',dx:w.x-o.x,dy:w.y-o.y}}else drag={id:e.pointerId,type:'pan',sx,sy,ox:view.ox,oy:view.oy};draw();refreshList()}else if(pointers.size===2){const pts=[...pointers.values()],dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);pinch={dist,scale:view.scale,mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},world:screenToWorld((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2)};drag=null}})
cvs.addEventListener('pointermove',e=>{const rect=cvs.getBoundingClientRect(),sx=e.clientX-rect.left,sy=e.clientY-rect.top;if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:sx,y:sy});if(pointers.size===2&&pinch){const pts=[...pointers.values()],dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y),mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};view.scale=Math.max(.15,Math.min(4,pinch.scale*dist/pinch.dist));view.ox=mid.x-pinch.world.x*view.scale;view.oy=mid.y-pinch.world.y*view.scale;draw();return}if(!drag||drag.id!==e.pointerId)return;if(drag.type==='obj'&&selected>=0){const w=screenToWorld(sx,sy),o=objects[selected];o.x=w.x-drag.dx;o.y=w.y-drag.dy;draw()}else if(drag.type==='pan'){view.ox=drag.ox+(sx-drag.sx);view.oy=drag.oy+(sy-drag.sy);draw()}})
function endPointer(e){if(drag&&drag.id===e.pointerId&&drag.type==='obj'&&selected>=0){maybeSnap(objects[selected]);draw()}pointers.delete(e.pointerId);drag=null;if(pointers.size<2)pinch=null}
cvs.addEventListener('pointerup',endPointer);cvs.addEventListener('pointercancel',endPointer);cvs.addEventListener('wheel',e=>{e.preventDefault();const r=cvs.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,w=screenToWorld(sx,sy),k=e.deltaY<0?1.1:.9;view.scale=Math.max(.15,Math.min(4,view.scale*k));view.ox=sx-w.x*view.scale;view.oy=sy-w.y*view.scale;draw()},{passive:false});
$('roomSelect').onchange=async e=>{if(objects.length&&!confirm('Switch rooms? Current placed furniture will be cleared.')){$('roomSelect').value=room;return}room=e.target.value;objects=[];selected=-1;await loadBase();refreshList();toast(room+' loaded')};$('guidesBtn').onclick=()=>{guides=!guides;draw()};$('snapBtn').onclick=()=>{snap=!snap;draw()};$('fitBtn').onclick=fit;$('objectsBtn').onclick=()=>{$('sheet').classList.toggle('show');refreshList()};$('fileInput').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('scaleRange').oninput=e=>{if(selected>=0){objects[selected].scale=+e.target.value/100;draw()}};$('duplicateBtn').onclick=duplicate;$('frontBtn').onclick=()=>{if(selected>=0&&selected<objects.length-1){const[o]=objects.splice(selected,1);objects.push(o);selected=objects.length-1;draw();refreshList()}};$('backBtn').onclick=()=>{if(selected>0){const[o]=objects.splice(selected,1);objects.unshift(o);selected=0;draw();refreshList()}};$('rotLBtn').onclick=()=>{if(selected>=0){objects[selected].rot-=Math.PI/12;draw()}};$('rotRBtn').onclick=()=>{if(selected>=0){objects[selected].rot+=Math.PI/12;draw()}};$('flipBtn').onclick=()=>{if(selected>=0){objects[selected].flip=!objects[selected].flip;draw()}};$('deleteBtn').onclick=()=>{if(selected>=0){objects.splice(selected,1);selected=-1;draw();refreshList()}};$('saveBtn').onclick=saveJSON;$('loadInput').onchange=e=>{if(e.target.files[0])loadJSON(e.target.files[0]);e.target.value=''};$('exportBtn').onclick=exportPNG;
window.addEventListener('resize',resize);setupRooms();loadBase().then(()=>{resize();fit();});
</script>
</body></html>
