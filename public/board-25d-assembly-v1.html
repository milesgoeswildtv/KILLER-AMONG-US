lass="hud"><div class="panel brand"><small>ASSEMBLY V1 · REAL ROOM ASSETS</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="rotL">↶90°</button><button id="rotR">↷90°</button><button id="minus">−</button><button id="plus">＋</button><button id="playBtn">PLAY</button><button id="fitBtn">FIT</button><button id="gridBtn">GRID</button><button id="assetBtn">ASSETS</button><button id="labelBtn">LABELS</button></div></div><div class="panel status" id="statusBox"><b>ROOM ASSET ASSEMBLY</b><br>All nine room sets are now placed from the actual uploaded PNGs. Tap a tile to inspect coordinates.</div><div class="panel legend"><b>LIVE ASSEMBLY</b><br><span class="ok">✓</span> exact 29×27<br><span class="ok">✓</span> actual room PNGs<br><span class="ok">✓</span> mathematical anchors<br><span class="ok">✓</span> depth sorting<br><span class="gold">PLAY</span> giant-board view<br><span class="warn">V1</span> placement tuning</div><script>const C=29,R=27,T=164,W=C*T,H=R*T,PHI=57,GAME_ZOOM=6,ROOT='/assets/board-ui/rooms/';const board=document.getElementById('board'),stage=document.getElementById('stage'),statusBox=document.getElementById('statusBox');const rooms=[['VAULT',2,2,6,5,'seamless_gray_marble_stone_texture.PNG'],['CONTROL ROOM',13,2,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['HIGH ROLLER ROOM',24,2,5,5,'dark_espresso_parquet_texture.PNG'],['BACK OFFICE',2,12,6,5,'burgundy_damask_velvet_texture.PNG'],['CASINO FLOOR',13,12,6,5,'burgundy_and_gold_ornamental_lattice.PNG'],['AFTERHOURS',24,12,5,5,'art_deco_plum_and_gold_marble_tile.PNG'],['WORKSHOP',2,22,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['KITCHEN',13,22,6,5,'seamless_gray_marble_stone_texture.PNG'],['BACK ROOM',24,22,5,5,'seamless_luxury_black_marble_texture.PNG']];const props=[

];const rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});const base=document.createElement('div');base.className='floorBase';board.appendChild(base);rooms.forEach(([n,x,y,w,h,tex])=>{const z=document.createElement('div');z.className='floorZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';z.style.backgroundImage=`linear-gradient(#0002,#0002),url('/assets/board-ui/floor-tiles/${tex}')`;board.appendChild(z)});[[8,7,5,15],[19,7,5,15]].forEach(([x,y,w,h])=>{const z=document.createElement('div');z.className='emZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';board.appendChild(z)});const center=(x,y)=>[(x-.5)*T,(y-.5)*T];for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){const e=document.createElement('i'),n=rc.get(x+','+y),per=x===1||x===C||y===1||y===R;e.className='cell '+(per?'perim ':'')+(n?'room ':'')+(n==='CASINO FLOOR'?'casino ':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';e.dataset.x=x;e.dataset.y=y;board.appendChild(e)}rooms.forEach(([n,x,y,w,h])=>{const f=document.createElement('i');f.className='roomframe';f.style.left=(x-1)*T+'px';f.style.top=(y-1)*T+'px';f.style.width=w*T+'px';f.style.height=h*T+'px';board.appendChild(f)});const propEls=[];props.forEach(([folder,file,x,y,width,kind])=>{const [cx,cy]=center(x,y),p=document.createElement('div');p.className='prop uprightSprite'+(kind?' '+kind:'');p.dataset.x=x;p.dataset.y=y;p.dataset.file=file;p.style.left=cx+'px';p.style.top=cy+'px';p.style.width=width+'px';const img=document.createElement('img');img.alt='';img.draggable=false;img.dataset.src=ROOT+folder+'/'+file;p.appendChild(img);board.appendChild(p);propEls.push(p)});rooms.forEach(([n,x,y,w,h])=>{const l=document.createElement('div');l.className='label uprightUI';l.textContent=n;l.style.left=(x-1+w/2)*T+'px';l.style.top=(y-1+h/2)*T+'px';board.appendChild(l)});function mkPiece(x,y,selected=false){const p=document.createElement('div');p.className='marker uprightUI'+(selected?' selected':'');p.dataset.x=x;p.dataset.y=y;const[cx,cy]=center(x,y);p.style.left=cx+'px';p.style.top=cy+'px';board.appendChild(p);return p}const selected=mkPiece(15,15,true),coord=document.createElement('div');coord.className='coord uprightUI';board.appendChild(coord);let turn=0,zoom=GAME_ZOOM,fit=1,panX=0,panY=0,drag=false,moved=false,startX=0,startY=0,startPanX=0,startPanY=0,gridOn=true,assetsOn=true,labelsOn=true;function projectedSize(angleDeg){const a=angleDeg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),cp=Math.cos(PHI*Math.PI/180),pts=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([x,y])=>[c*x-s*y,(s*x+c*y)*cp]);return[Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))-Math.min(...pts.map(p=>p[1]))]}function calcFit(){const[pw,ph]=projectedSize(-45+turn),availW=Math.max(200,innerWidth-24),availH=Math.max(220,innerHeight-355);fit=Math.min(availW/pw,availH/ph,.72)}function updateSprites(){const angle=-45+turn,a=angle*Math.PI/180;document.querySelectorAll('.uprightUI').forEach(e=>e.style.transform=`translate(-50%,-50%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`);propEls.forEach(e=>{e.style.transform=`translate(-50%,-86%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`;const x=(+e.dataset.x-.5)*T-W/2,y=(+e.dataset.y-.5)*T-H/2,depth=Math.sin(a)*x+Math.cos(a)*y;e.style.zIndex=2000+Math.round(depth/4)})}function draw(){const s=fit*zoom;board.style.left=(innerWidth/2-W/2+panX)+'px';const usableCenterY=170+(innerHeight-355)/2;board.style.top=(usableCenterY-H/2+panY)+'px';board.style.transform=`scale(${s}) rotateX(${PHI}deg) rotateZ(${-45+turn}deg)`;updateSprites()}function setMode(z,label){zoom=z;panX=panY=0;calcFit();draw();statusBox.innerHTML=`<b>${label}</b><br>${label==='PLAY VIEW'?'Real room assets anchored into the accepted giant-board scale.':'Whole 29×27 asset assembly.'}`}function placeSelected(x,y){const n=rc.get(x+','+y),[cx,cy]=center(x, ver(entries=>entries.forEach(en=>{if(en.isIntersecting){const img=en.target.querySelector('img');if(img&&!img.src){img.src=img.dataset.src;img.onerror=()=>{en.target.style.outline='5px solid #f33';console.error('Missing asset',img.dataset.src)}}io.unobserve(en.target)}}),{root:stage,rootMargin:'700px'});propEls.forEach(p=>io.observe(p));calcFit();placeSelected(15,15);draw();</script></body></html>
