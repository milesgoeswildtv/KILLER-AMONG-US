<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KILLER AMONG US — Floor Assembly V1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;color:#f4dfb0;font-family:Arial,sans-serif}body{position:fixed;inset:0}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 44%,#261014 0,#080606 52%,#010101 100%)}#board{position:absolute;width:4756px;height:4428px;transform-origin:50% 50%;transform-style:preserve-3d;will-change:left,top,transform}.floorBase,.floorZone,.emZone{position:absolute;pointer-events:none}.floorBase{inset:0;z-index:1;background-image:linear-gradient(#0005,#0005),url('/assets/board-ui/floor-tiles/seamless_luxury_black_marble_texture.PNG');background-size:820px 820px}.floorZone{z-index:2;background-size:700px 700px;background-repeat:repeat;box-shadow:inset 0 0 90px #0009}.emZone{z-index:3;background:radial-gradient(circle at 50% 50%,#f0a52f3d 0,#a85b171e 55%,transparent 78%);box-shadow:inset 0 0 80px #f1a53b33}.cell{position:absolute;width:164px;height:164px;z-index:5;border:1px solid #d8b76533;background:transparent}.cell.room{border-color:#d3a64d22}.cell.casino{border-color:#f1c26a44}.cell.perim{border:4px solid #5ad0dc77;box-shadow:inset 0 0 30px #1e6f7833}.roomframe{position:absolute;border:8px solid #b88a3e99;pointer-events:none;z-index:7;box-shadow:0 0 0 2px #0008,inset 0 0 30px #0008}.label{position:absolute;z-index:15;transform-origin:center;background:#070504dd;border:3px solid #bd8d3c;border-radius:10px;padding:10px 15px;color:#f1d9a4;font:900 18px Georgia;white-space:nowrap;letter-spacing:.06em;pointer-events:none}.coord{position:absolute;z-index:25;transform-origin:center;font:900 18px monospace;background:#000d;color:#fff;border:2px solid #d6a64c;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}.marker{position:absolute;z-index:20;transform-origin:center;width:112.75px;height:112.75px;border-radius:50%;background:#090909;border:8px solid #e0ae50;box-shadow:0 14px 16px #000,0 0 0 4px #120c08;pointer-events:none}.marker.red{border-color:#ca3444}.marker:after{content:"";position:absolute;left:50%;top:-68px;transform:translateX(-50%);width:54px;height:74px;border-radius:50% 50% 36% 36%;background:#111;border:8px solid inherit}.marker.selected{box-shadow:0 0 0 12px #fff8,0 14px 16px #000}.hud{position:fixed;left:10px;right:10px;top:max(9px,env(safe-area-inset-top));z-index:50;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#080606ed;border:1px solid #8f6a31;border-radius:10px;padding:8px 10px;box-shadow:0 7px 20px #000;pointer-events:auto}.brand small{display:block;font-size:8px;color:#65d9e4;letter-spacing:.16em}.brand b{font:900 17px Georgia}.brand span{color:#c52d3b}.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:280px}button{background:#160e0b;color:#f2d8a1;border:1px solid #8e692f;border-radius:7px;font-weight:900;min-height:36px;padding:0 8px}.status{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:50;max-width:360px;font-size:10px;line-height:1.35}.legend{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:50;font-size:9px;max-width:210px}.ok{color:#75df8b}.gold{color:#e3b458}@media(max-width:520px){.legend{max-width:150px}.status{max-width:58%}.brand b{font-size:15px}}</style></head><body><div id="stage"><div id="board"></div></div><div class="hud"><div class="panel brand"><small>FLOOR ASSEMBLY V1 · EXACT 29×27</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="rotL">↶90°</button><button id="rotR">↷90°</button><button id="minus">−</button><button id="plus">＋</button><button id="playBtn">PLAY</button><button id="fitBtn">FIT</button><button id="gridBtn">GRID</button></div></div><div class="panel status" id="statusBox"><b>TEXTURED FLOOR PASS</b><br>Exact V5 geometry. AI textures are clipped by mathematical room rectangles; geometry is untouched.</div><div class="panel legend"><b>FLOOR MASTER</b><br><span class="ok">✓</span> 29×27 unchanged<br><span class="ok">✓</span> rooms exact<br><span class="ok">✓</span> 5-wide light zones<br><span class="ok">✓</span> 1-tile perimeter<br><span class="gold">PLAY</span> giant-board view</div><script>const C=29,R=27,T=164,W=C*T,H=R*T,PHI=57,GAME_ZOOM=6;const board=document.getElementById('board'),stage=document.getElementById('stage'),statusBox=document.getElementById('statusBox');const rooms=[['VAULT',2,2,6,5,'seamless_gray_marble_stone_texture.PNG'],['CONTROL ROOM',13,2,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['HIGH ROLLER ROOM',24,2,5,5,'dark_espresso_parquet_texture.PNG'],['BACK OFFICE',2,12,6,5,'burgundy_damask_velvet_texture.PNG'],['CASINO FLOOR',13,12,6,5,'burgundy_and_gold_ornamental_lattice.PNG'],['AFTERHOURS',24,12,5,5,'art_deco_plum_and_gold_marble_tile.PNG'],['WORKSHOP',2,22,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['KITCHEN',13,22,6,5,'seamless_gray_marble_stone_texture.PNG'],['BACK ROOM',24,22,5,5,'seamless_luxury_black_marble_texture.PNG']];const rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});const base=document.createElement('div');base.className='floorBase';board.appendChild(base);rooms.forEach(([n,x,y,w,h,tex])=>{const z=document.createElement('div');z.className='floorZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';z.style.backgroundImage=`linear-gradient(#0002,#0002),url('/assets/board-ui/floor-tiles/${tex}')`;board.appendChild(z)});[[8,7,5,15],[19,7,5,15]].forEach(([x,y,w,h])=>{const z=document.createElement('div');z.className='emZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';board.appendChild(z)});const center=(x,y)=>[(x-.5)*T,(y-.5)*T];for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){const e=document.createElement('i'),n=rc.get(x+','+y),per=x===1||x===C||y===1||y===R;e.className='cell '+(per?'perim ':'')+(n?'room ':'')+(n==='CASINO FLOOR'?'casino ':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';e.dataset.x=x;e.dataset.y=y;board.appendChild(e)}rooms.forEach(([n,x,y,w,h])=>{const f=document.createElement('i');f.className='roomframe';f.style.left=(x-1)*T+'px';f.style.top=(y-1)*T+'px';f.style.width=w*T+'px';f.style.height=h*T+'px';board.appendChild(f);const l=document.createElement('div');l.className='label upright';l.textContent=n;l.style.left=(x-1+w/2)*T+'px';l.style.top=(y-1+h/2)*T+'px';board.appendChild(l)});function mkPiece(x,y,red=false,selected=false){const p=document.createElement('div');p.className='marker upright'+(red?' red':'')+(selected?' selected':'');const[cx,cy]=center(x,y);p.style.left=cx+'px';p.style.top=cy+'px';board.appendChild(p);return p}[[14,13],[15,13],[16,13],[17,13],[14,14],[15,14],[16,14],[17,14]].forEach((p,i)=>mkPiece(p[0],p[1],i>=4));const selected=mkPiece(15,15,false,true),coord=document.createElement('div');coord.className='coord upright';board.appendChild(coord);let turn=0,zoom=GAME_ZOOM,fit=1,panX=0,panY=0,drag=false,moved=false,startX=0,startY=0,startPanX=0,startPanY=0,gridOn=true;function projectedSize(angleDeg){const a=angleDeg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),cp=Math.cos(PHI*Math.PI/180),pts=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([x,y])=>[c*x-s*y,(s*x+c*y)*cp]);return[Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))-Math.min(...pts.map(p=>p[1]))]}function calcFit(){const[pw,ph]=projectedSize(-45+turn),availW=Math.max(200,innerWidth-24),availH=Math.max(220,innerHeight-355);fit=Math.min(availW/pw,availH/ph,.72)}function counterRotate(){const angle=-45+turn;document.querySelectorAll('.upright').forEach(e=>e.style.transform=`translate(-50%,-50%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`)}function draw(){const s=fit*zoom;board.style.left=(innerWidth/2-W/2+panX)+'px';const usableCenterY=170+(innerHeight-355)/2;board.style.top=(usableCenterY-H/2+panY)+'px';board.style.transform=`scale(${s}) rotateX(${PHI}deg) rotateZ(${-45+turn}deg)`;counterRotate()}function setMode(z,label){zoom=z;panX=panY=0;calcFit();draw();statusBox.innerHTML=`<b>${label}</b><br>${label==='PLAY VIEW'?'Same accepted 2× gameplay scale. Pan to inspect materials.':'Whole 29×27 floor master.'}`}function placeSelected(x,y){const n=rc.get(x+','+y),[cx,cy]=center(x,y);selected.style.left=cx+'px';selected.style.top=cy+'px';coord.style.left=cx+'px';coord.style.top=(cy+90)+'px';coord.textContent=`${x},${y}`;statusBox.innerHTML=`<b>TILE ${x},${y}</b><br>${n||(x===1||x===29||y===1||y===27?'ONE-TILE PERIMETER':'CORRIDOR')}`;counterRotate()}rotL.onclick=()=>{turn=(turn+270)%360;calcFit();draw()};rotR.onclick=()=>{turn=(turn+90)%360;calcFit();draw()};plus.onclick=()=>{zoom=Math.min(10,zoom*1.18);draw()};minus.onclick=()=>{zoom=Math.max(.45,zoom/1.18);draw()};playBtn.onclick=()=>setMode(GAME_ZOOM,'PLAY VIEW');fitBtn.onclick=()=>setMode(1,'FIT VIEW');gridBtn.onclick=()=>{gridOn=!gridOn;document.querySelectorAll('.cell').forEach(e=>e.style.borderColor=gridOn?'':'transparent');statusBox.innerHTML=`<b>GRID ${gridOn?'ON':'OFF'}</b><br>Texture geometry remains mathematical either way.`};stage.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>6)moved=true;if(moved){panX=startPanX+dx;panY=startPanY+dy;draw()}});stage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.classList.contains('cell'))placeSelected(+el.dataset.x,+el.dataset.y)}});stage.addEventListener('pointercancel',()=>drag=false);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',()=>{calcFit();draw()});calcFit();placeSelected(15,15);draw();</script></body></html>
