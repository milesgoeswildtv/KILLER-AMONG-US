<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KILLER AMONG US — Vault Layout Lab V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#f3dfb0;font-family:Arial,sans-serif}body{position:fixed;inset:0}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 48%,#231012 0,#090606 48%,#020202 100%)}
.top{z-index:50;padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:flex;gap:8px;align-items:stretch}
.panel{background:#090606ed;border:1px solid #936d31;border-radius:10px;box-shadow:0 7px 20px #000}
.brand{padding:8px 10px;min-width:150px;flex:1}.brand small{display:block;color:#75d7e5;font-size:8px;font-weight:800;letter-spacing:.18em}.brand b{font:900 18px Georgia}.brand span{color:#ce3543}
.tools{padding:6px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:650px}
button{background:#17100d;color:#f1daa8;border:1px solid #8f682f;border-radius:7px;min-height:34px;padding:0 8px;font-weight:900}
button.active{outline:2px solid #69d3e4;color:#bff5ff}button.warn{border-color:#8f3333;color:#f2b6b6}
.stage{position:relative;min-height:0;overflow:hidden;touch-action:none}
.room{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);transform-origin:center;will-change:transform}
.floorSvg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 28px 36px #000)}
.propWrap{position:absolute;width:0;height:0;transform-origin:0 0;user-select:none;touch-action:none;will-change:left,top,transform}
.prop{position:absolute;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab;filter:drop-shadow(0 14px 12px #000b);max-width:none}
.prop.selected{filter:drop-shadow(0 0 10px #6ce4ff) drop-shadow(0 14px 12px #000b)}
.visibleBox{position:absolute;border:1.5px dashed #69d3e4;pointer-events:none;display:none;box-shadow:0 0 7px #69d3e466}
.propWrap.selected .visibleBox{display:block}
.selectRing{position:absolute;width:22px;height:22px;border:3px solid #6ce4ff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9998;box-shadow:0 0 16px #6ce4ff;background:#071014aa}
.tileHit{position:absolute;width:54px;height:34px;transform:translate(-50%,-50%);border-radius:50%;display:none;z-index:750}
.walkOn .tileHit{display:block}
.testPiece{position:absolute;width:126px;height:63px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #74ddef;background:#63d9ed35;box-shadow:0 0 18px #63d9edaa;z-index:900;pointer-events:none;display:none}
.walkOn .testPiece{display:block}
.testPiece:after{content:"PIECE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:900;color:#c8f8ff;letter-spacing:.1em}
.bottom{z-index:60;padding:8px 10px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.readout{padding:9px 10px;font-size:11px;line-height:1.45}.readout b{font-size:13px}.readout .cyan{color:#77dceb}.readout .gold{color:#e8bb65}.readout .green{color:#78e79a}.tip{color:#bca77b}
.assetTools{padding:6px;display:grid;grid-template-columns:repeat(6,minmax(48px,1fr));gap:5px;min-width:min(650px,68vw)}.assetTools button{min-height:38px}
.hidden{display:none!important}
@media(max-width:820px){
 .top{align-items:flex-start}.brand{min-width:122px}.brand b{font-size:15px}.tools{max-width:285px}.tools button{font-size:9px;padding:0 5px;min-height:30px}
 .bottom{grid-template-columns:1fr}.assetTools{min-width:0;width:100%;grid-template-columns:repeat(6,1fr)}.assetTools button{font-size:9px;padding:0 3px}.readout{font-size:10px}.stage{min-height:0}
}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div class="panel brand"><small>ROOM LAYOUT LAB · VAULT ONLY · 6×5 · V5</small><b>KILLER <span>AMONG US</span></b></div>
  <div class="panel tools">
   <button id="fit">FIT</button><button id="grid" class="active">GRID</button><button id="centers" class="active">CENTERS</button>
   <button id="boundsBtn">BOUNDS</button><button id="walkBtn">WALK TEST</button>
   <button id="clean">TRY CLEAN START</button><button id="restore">RESTORE MINE</button>
   <button id="copy">COPY LAYOUT</button><button id="reset" class="warn">RESET</button>
  </div>
 </div>
 <div class="stage" id="stage"><div class="room" id="room"><svg class="floorSvg" id="floor"></svg><div class="selectRing hidden" id="ring"></div><div class="testPiece" id="testPiece"></div></div></div>
 <div class="bottom">
  <div class="panel readout" id="readout"><b>VAULT — CALIBRATION V5</b><br><span class="cyan">Measuring the actual visible pixels inside each PNG…</span></div>
  <div class="panel assetTools">
   <button id="prev">◀ PROP</button><button id="next">PROP ▶</button><button id="smaller">SIZE −</button><button id="bigger">SIZE +</button><button id="mirror">MIRROR</button><button id="free">FREE</button>
   <button id="wallBack">BACK WALL</button><button id="wallLeft">LEFT WALL</button><button id="wallRight">RIGHT WALL</button><button id="back">SEND BACK</button><button id="front">BRING FRONT</button>
  </div>
 </div>
</div>
<script>
const ROOM={w:6,h:5}, TW=184, TH=92;
const ROOT=location.protocol==='file:'?'./':'/assets/board-ui/rooms/vault/';
const FLOOR=location.protocol==='file:'?'./seamless_gray_marble_stone_texture.png':'/assets/board-ui/floor-tiles/seamless_gray_marble_stone_texture.PNG';
const SAVE_KEY='kau_vault_layout_lab_v5_alpha';
const OLD_SAVE_KEY='kau_vault_layout_lab_v4';
const BACKUP_KEY='kau_vault_layout_lab_v5_backup';
const DEFAULTS=[
 {id:'door',file:'vault_main_door.PNG',local:'vault_main_door.png',label:'Main Vault Door',x:4.72,y:.62,vw:1.55,orient:'back',flip:true,bias:-40},
 {id:'deposit',file:'vault_safe_deposit_wall.PNG',local:'vault_safe_deposit_wall.png',label:'Safe Deposit Wall',x:1.55,y:.62,vw:1.72,orient:'back',flip:false,bias:-35},
 {id:'security',file:'vault_security_station.PNG',local:'vault_security_station.png',label:'Security Station',x:1.25,y:2.85,vw:1.70,orient:'free',flip:true,bias:15},
 {id:'display',file:'vault_secure_display_table.PNG',local:'vault_secure_display_table.png',label:'Secure Display Table',x:3.40,y:2.45,vw:1.18,orient:'free',flip:false,bias:20},
 {id:'trolley',file:'vault_lockbox_trolley.PNG',local:'vault_lockbox_trolley.png',label:'Lockbox Trolley',x:1.90,y:4.10,vw:.88,orient:'free',flip:false,bias:30}
];
const CLEAN=JSON.parse(JSON.stringify(DEFAULTS));
const METRICS={};
function clone(v){return JSON.parse(JSON.stringify(v))}
let legacy=false;
function loadSaved(){
 try{
  const cur=localStorage.getItem(SAVE_KEY);
  if(cur){const d=JSON.parse(cur);if(Array.isArray(d)&&d.length===DEFAULTS.length)return d.map((a,i)=>({...DEFAULTS[i],...a}));}
  const old=localStorage.getItem(OLD_SAVE_KEY);
  if(old){
   const d=JSON.parse(old);
   if(Array.isArray(d)&&d.length===DEFAULTS.length){
    legacy=true;
    return d.map((a,i)=>({...DEFAULTS[i],x:Number.isFinite(a.x)?a.x:DEFAULTS[i].x,y:Number.isFinite(a.y)?a.y:DEFAULTS[i].y,legacyW:Number.isFinite(a.w)?a.w:undefined,orient:a.orient||DEFAULTS[i].orient,flip:!!a.flip,bias:Number.isFinite(a.bias)?a.bias:DEFAULTS[i].bias}));
   }
  }
 }catch(e){}
 return clone(DEFAULTS);
}
const ASSETS=loadSaved();
const stage=document.getElementById('stage'),room=document.getElementById('room'),floor=document.getElementById('floor'),ring=document.getElementById('ring'),readout=document.getElementById('readout'),testPiece=document.getElementById('testPiece');
let selected=3,showGrid=true,showCenters=true,showBounds=false,walkMode=false,drag=null,roomScale=1,test={x:5.5,y:2.5};
function P(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function bounds(){const ps=[P(0,0),P(ROOM.w,0),P(ROOM.w,ROOM.h),P(0,ROOM.h)];return{minX:Math.min(...ps.map(p=>p.x)),maxX:Math.max(...ps.map(p=>p.x)),minY:Math.min(...ps.map(p=>p.y)),maxY:Math.max(...ps.map(p=>p.y))}}
function floorPoint(x,y,b){const p=P(x,y);return`${p.x-b.minX},${p.y-b.minY}`}
function assetURL(a){return ROOT+(location.protocol==='file:'?a.local:a.file)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(ASSETS))}catch(e){}}
function measure(a){
 return new Promise(resolve=>{
  const im=new Image();
  im.onload=()=>{
   try{
    const max=512,s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);
    const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,b=-1;
    for(let y=0;y<h;y++){for(let x=0;x<w;x++){if(data[(y*w+x)*4+3]>16){if(x<l)l=x;if(x>r)r=x;if(y<t)t=y;if(y>b)b=y;}}}
    if(r<l){l=0;t=0;r=w-1;b=h-1}
    METRICS[a.id]={nw:im.naturalWidth,nh:im.naturalHeight,l:l/s,t:t/s,r:(r+1)/s,b:(b+1)/s,rw:((r+1-l)/w),rh:((b+1-t)/h)};
   }catch(e){METRICS[a.id]={nw:im.naturalWidth||1,nh:im.naturalHeight||1,l:0,t:0,r:im.naturalWidth||1,b:im.naturalHeight||1,rw:1,rh:1};}
   resolve();
  };
  im.onerror=()=>{METRICS[a.id]={nw:1,nh:1,l:0,t:0,r:1,b:1,rw:1,rh:1};resolve()};
  im.src=assetURL(a);
 });
}
async function initMetrics(){
 await Promise.all(ASSETS.map(measure));
 if(legacy){
  ASSETS.forEach(a=>{if(Number.isFinite(a.legacyW)){a.vw=+(a.legacyW*(METRICS[a.id]?.rw||1)).toFixed(3);delete a.legacyW;}});
  legacy=false;save();
 }
 render();
}
function drawFloor(){
 const b=bounds(),W=b.maxX-b.minX,H=b.maxY-b.minY;floor.setAttribute('width',W);floor.setAttribute('height',H);floor.setAttribute('viewBox',`0 0 ${W} ${H}`);floor.style.left=b.minX+'px';floor.style.top=b.minY+'px';
 let q=`<defs><pattern id="marble" patternUnits="userSpaceOnUse" width="420" height="420"><image href="${FLOOR}" x="0" y="0" width="420" height="420" opacity=".76"/></pattern></defs>`;
 q+=`<polygon points="${floorPoint(0,0,b)} ${floorPoint(ROOM.w,0,b)} ${floorPoint(ROOM.w,ROOM.h,b)} ${floorPoint(0,ROOM.h,b)}" fill="url(#marble)" stroke="#c89943" stroke-width="5"/>`;
 if(showGrid){for(let x=0;x<=ROOM.w;x++)q+=`<line x1="${P(x,0).x-b.minX}" y1="${P(x,0).y-b.minY}" x2="${P(x,ROOM.h).x-b.minX}" y2="${P(x,ROOM.h).y-b.minY}" stroke="#b78b4370" stroke-width="1.5"/>`;for(let y=0;y<=ROOM.h;y++)q+=`<line x1="${P(0,y).x-b.minX}" y1="${P(0,y).y-b.minY}" x2="${P(ROOM.w,y).x-b.minX}" y2="${P(ROOM.w,y).y-b.minY}" stroke="#b78b4370" stroke-width="1.5"/>`}
 if(showCenters){for(let y=0;y<ROOM.h;y++)for(let x=0;x<ROOM.w;x++){const c=P(x+.5,y+.5);q+=`<circle cx="${c.x-b.minX}" cy="${c.y-b.minY}" r="4" fill="#61d9ec" opacity=".72"/>`}}
 const e1=P(ROOM.w,1.9),e2=P(ROOM.w,3.1),s1=P(2.35,ROOM.h),s2=P(3.65,ROOM.h);
 q+=`<line x1="${e1.x-b.minX}" y1="${e1.y-b.minY}" x2="${e2.x-b.minX}" y2="${e2.y-b.minY}" stroke="#62e4f7" stroke-width="8"/><text x="${(e1.x+e2.x)/2-b.minX+18}" y="${(e1.y+e2.y)/2-b.minY}" fill="#9aeeff" font-size="18" font-weight="900">E</text>`;
 q+=`<line x1="${s1.x-b.minX}" y1="${s1.y-b.minY}" x2="${s2.x-b.minX}" y2="${s2.y-b.minY}" stroke="#62e4f7" stroke-width="8"/><text x="${(s1.x+s2.x)/2-b.minX}" y="${(s1.y+s2.y)/2-b.minY+24}" fill="#9aeeff" font-size="18" font-weight="900">S</text>`;
 floor.innerHTML=q;
}
function ensureTileHits(){
 if(document.querySelectorAll('.tileHit').length===ROOM.w*ROOM.h)return;
 for(let y=0;y<ROOM.h;y++)for(let x=0;x<ROOM.w;x++){
  const h=document.createElement('div');h.className='tileHit';const p=P(x+.5,y+.5);h.style.left=p.x+'px';h.style.top=p.y+'px';h.dataset.x=x+.5;h.dataset.y=y+.5;
  h.addEventListener('pointerdown',e=>{if(!walkMode)return;e.stopPropagation();test={x:+h.dataset.x,y:+h.dataset.y};renderTest();});
  room.appendChild(h);
 }
}
function fit(){const r=stage.getBoundingClientRect(),b=bounds(),W=b.maxX-b.minX,H=b.maxY-b.minY;roomScale=Math.min((r.width-38)/(W+310),(r.height-40)/(H+330),1.18);room.style.transform=`translate(-50%,-50%) scale(${roomScale})`}
function transformFor(a){const f=a.flip?-1:1;return`scaleX(${f})`}
function propEl(a,i){
 let wrap=document.getElementById('w_'+a.id),img,box;
 if(!wrap){
  wrap=document.createElement('div');wrap.id='w_'+a.id;wrap.className='propWrap';wrap.dataset.i=i;
  img=document.createElement('img');img.className='prop';img.src=assetURL(a);img.alt=a.label;img.draggable=false;img.dataset.i=i;img.addEventListener('pointerdown',down);
  box=document.createElement('div');box.className='visibleBox';wrap.append(img,box);room.appendChild(wrap);
 }else{img=wrap.querySelector('.prop');box=wrap.querySelector('.visibleBox')}
 const p=P(a.x,a.y),m=METRICS[a.id]||{nw:1,nh:1,l:0,t:0,r:1,b:1,rw:1,rh:1};
 const visibleW=(a.vw||1)*TW,fullW=visibleW/Math.max(.05,m.rw),px=fullW/m.nw;
 const center=((m.l+m.r)/2)*px,bottom=m.b*px;
 wrap.style.left=p.x+'px';wrap.style.top=p.y+'px';wrap.style.transform=transformFor(a);wrap.style.zIndex=1000+Math.round((a.x+a.y)*40)+(a.bias||0);
 img.style.width=fullW+'px';img.style.left=(-center)+'px';img.style.top=(-bottom)+'px';
 box.style.left=(m.l*px-center)+'px';box.style.top=(m.t*px-bottom)+'px';box.style.width=((m.r-m.l)*px)+'px';box.style.height=((m.b-m.t)*px)+'px';box.style.display=showBounds?'block':'none';
 wrap.classList.toggle('selected',i===selected);img.classList.toggle('selected',i===selected);
}
function renderTest(){const p=P(test.x,test.y);testPiece.style.left=p.x+'px';testPiece.style.top=p.y+'px';testPiece.style.zIndex=900+Math.round((test.x+test.y)*40)}
function render(){drawFloor();ASSETS.forEach(propEl);ensureTileHits();room.classList.toggle('walkOn',walkMode);renderTest();fit();updateSelection();save()}
function updateSelection(){
 const a=ASSETS[selected],p=P(a.x,a.y),m=METRICS[a.id];
 ring.classList.remove('hidden');ring.style.left=p.x+'px';ring.style.top=p.y+'px';
 ['free','back','left','right'].forEach(k=>document.getElementById(k==='free'?'free':'wall'+k[0].toUpperCase()+k.slice(1))?.classList.toggle('active',a.orient===k));
 document.getElementById('mirror').classList.toggle('active',!!a.flip);
 const measured=m?`${Math.round(m.rw*100)}% of PNG width is visible`:'measuring…';
 readout.innerHTML=`<b>VAULT — ${a.label}</b><br><span class="cyan">Anchor:</span> ${a.x.toFixed(2)}, ${a.y.toFixed(2)} tiles &nbsp; <span class="gold">VISIBLE width:</span> ${(a.vw||0).toFixed(2)} tiles &nbsp; <span class="cyan">Mode:</span> ${(a.orient||'free').toUpperCase()}<br><span class="green">✓ autosaved</span> · ${measured}<br><span class="tip">Size now ignores transparent PNG padding. BOUNDS shows what the lab actually measured. WALK TEST drops a production-scale piece base on any tile center.</span>`;
}
function select(i){selected=(i+ASSETS.length)%ASSETS.length;render()}
function down(e){e.preventDefault();const i=+e.currentTarget.dataset.i;selected=i;const a=ASSETS[i];drag={i,sx:e.clientX,sy:e.clientY,x:a.x,y:a.y};e.currentTarget.setPointerCapture?.(e.pointerId);render()}
window.addEventListener('pointermove',e=>{if(!drag)return;const a=ASSETS[drag.i],dx=(e.clientX-drag.sx)/roomScale,dy=(e.clientY-drag.sy)/roomScale;const tx=drag.x+dx/TW+dy/TH,ty=drag.y+dy/TH-dx/TW;a.x=Math.max(.15,Math.min(ROOM.w-.15,tx));a.y=Math.max(.15,Math.min(ROOM.h-.15,ty));render()});
window.addEventListener('pointerup',()=>drag=null);
function size(d){ASSETS[selected].vw=Math.max(.35,Math.min(2.9,(ASSETS[selected].vw||1)+d));render()}
function bias(d){ASSETS[selected].bias=(ASSETS[selected].bias||0)+d;render()}
function mirror(){ASSETS[selected].flip=!ASSETS[selected].flip;render()}
function setMode(mode){
 const a=ASSETS[selected];a.orient=mode;
 if(mode==='back')a.y=.58;
 if(mode==='left')a.x=.58;
 if(mode==='right')a.x=ROOM.w-.58;
 render();
}
function copyLayout(){
 const payload={room:'vault',footprint:{w:ROOM.w,h:ROOM.h},measurement:'alpha-visible-v1',assets:ASSETS.map(({id,file,label,x,y,vw,orient,flip,bias})=>({id,file,label,x:+x.toFixed(3),y:+y.toFixed(3),visibleWidthTiles:+(vw||0).toFixed(3),orientation:orient||'free',mirror:!!flip,depthBias:bias||0}))};
 const text=JSON.stringify(payload,null,2);
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>readout.innerHTML='<b>VAULT LAYOUT COPIED</b><br><span class="green">Paste it into chat when you want me to lock it.</span>').catch(()=>prompt('Copy this layout:',text))}else prompt('Copy this layout:',text);
}
function cleanStart(){
 try{localStorage.setItem(BACKUP_KEY,JSON.stringify(ASSETS))}catch(e){}
 ASSETS.splice(0,ASSETS.length,...clone(CLEAN));selected=3;save();render();
 readout.innerHTML='<b>CLEAN START LOADED</b><br><span class="green">Your previous layout is backed up.</span> Use RESTORE MINE if you hate this one.';
}
function restoreMine(){
 try{const raw=localStorage.getItem(BACKUP_KEY);if(!raw){readout.innerHTML='<b>NO BACKUP YET</b><br><span class="tip">TRY CLEAN START makes a backup first.</span>';return}const d=JSON.parse(raw);if(Array.isArray(d)&&d.length===ASSETS.length){ASSETS.splice(0,ASSETS.length,...d);save();render();}}catch(e){}
}
document.getElementById('prev').onclick=()=>select(selected-1);document.getElementById('next').onclick=()=>select(selected+1);
document.getElementById('smaller').onclick=()=>size(-.06);document.getElementById('bigger').onclick=()=>size(.06);
document.getElementById('mirror').onclick=mirror;document.getElementById('free').onclick=()=>setMode('free');document.getElementById('wallBack').onclick=()=>setMode('back');document.getElementById('wallLeft').onclick=()=>setMode('left');document.getElementById('wallRight').onclick=()=>setMode('right');
document.getElementById('back').onclick=()=>bias(-60);document.getElementById('front').onclick=()=>bias(60);
document.getElementById('fit').onclick=fit;document.getElementById('copy').onclick=copyLayout;document.getElementById('clean').onclick=cleanStart;document.getElementById('restore').onclick=restoreMine;
document.getElementById('grid').onclick=e=>{showGrid=!showGrid;e.currentTarget.classList.toggle('active',showGrid);render()};
document.getElementById('centers').onclick=e=>{showCenters=!showCenters;e.currentTarget.classList.toggle('active',showCenters);render()};
document.getElementById('boundsBtn').onclick=e=>{showBounds=!showBounds;e.currentTarget.classList.toggle('active',showBounds);render()};
document.getElementById('walkBtn').onclick=e=>{walkMode=!walkMode;e.currentTarget.classList.toggle('active',walkMode);render()};
document.getElementById('reset').onclick=()=>{if(confirm('Reset the Vault lab to the new measured defaults?')){ASSETS.splice(0,ASSETS.length,...clone(DEFAULTS));selected=3;save();render()}};
window.addEventListener('resize',render);
render();initMetrics();
</script>
</body>
</html>
