<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KILLER AMONG US — HQ Art Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#f4dfb0;font-family:Arial,sans-serif;overscroll-behavior:none}body{position:fixed;inset:0}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 42%,#3b1017 0,#110807 38%,#030303 76%)}#world{position:absolute;left:50%;top:50%;width:4600px;height:3300px;transform-origin:0 0}#base{position:absolute;left:900px;top:390px;width:2378px;height:2214px;transform:rotateX(57deg) rotateZ(-45deg);transform-style:preserve-3d;background:#0b0908;border:8px solid #b88837;box-shadow:0 90px 150px #000,0 0 0 18px #080604;clip-path:polygon(7% 0,93% 0,100% 8%,100% 92%,93% 100%,7% 100%,0 92%,0 8%)}.cell{position:absolute;width:82px;height:82px;border:1px solid #5a4930;background:linear-gradient(135deg,#191411,#0d0b0a);box-shadow:inset 0 0 12px #000}.cell.hall{background:linear-gradient(135deg,#17110e,#0a0908);border-color:#3f3428}.cell.room{background:linear-gradient(135deg,#2a1b12,#100d0a);border-color:#7d6031}.cell.casino{background:radial-gradient(circle,#55131c,#240b0e 70%);border-color:#9e6d36}.cell.emergency:after{content:"";position:absolute;inset:32px;border-radius:50%;background:#d9a84a;box-shadow:0 0 14px #d9a84a}.roomframe{position:absolute;border:5px solid #c59640;box-shadow:inset 0 0 30px #000;z-index:4;pointer-events:none}.roomframe:before{content:"";position:absolute;left:-7px;right:-7px;top:-12px;height:12px;background:linear-gradient(#4a2d1b,#170f0b);border:2px solid #9d7330;box-shadow:5px 7px 0 #050403}.label{position:absolute;z-index:11;transform:translate(-50%,-50%);background:#080604ee;border:2px solid #c59640;border-radius:4px;padding:6px 10px;color:#f5dfad;font:900 11px Georgia;letter-spacing:.08em;white-space:nowrap;box-shadow:0 5px 12px #000}.prop{position:absolute;z-index:7;border:2px solid #a67a34;background:linear-gradient(145deg,#3b291c,#130e0b);box-shadow:5px 7px 0 #050403}.prop.red{background:linear-gradient(145deg,#5b121b,#19080b)}.prop.blue{background:linear-gradient(145deg,#0b2636,#071015);border-color:#4385a4;box-shadow:0 0 12px #2187b555}.prop.green{background:radial-gradient(ellipse,#17472e,#092116);border-radius:50%;border-color:#b88938}.prop.round{border-radius:50%}.door{position:absolute;z-index:13;width:38px;height:8px;background:#efbf5d;box-shadow:0 0 13px #efbf5d}.pass{position:absolute;z-index:14;width:28px;height:28px;border-radius:50%;background:#070606;border:5px solid #c12b39;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:900}.piece{position:absolute;z-index:20;width:46px;height:64px;transform:translate(-50%,-84%) rotateZ(45deg) rotateX(-57deg);filter:drop-shadow(0 8px 5px #000)}.piece i{display:block;margin:auto;background:#090808;border:4px solid #d3a44b}.piece .h{width:27px;height:27px;border-radius:50%}.piece .b{width:34px;height:36px;border-radius:11px 11px 5px 5px;margin-top:-2px}.piece.red i{border-color:#c42e3c}.branding{position:absolute;z-index:8;color:#d4a34c;font:900 34px Georgia;text-shadow:0 3px 6px #000}.hud{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:30;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#080606e8;border:1px solid #8e692f;border-radius:10px;padding:9px 11px;box-shadow:0 8px 22px #000;pointer-events:auto}.brand small{display:block;color:#b98d49;font-size:8px;letter-spacing:.2em}.brand b{font:900 19px Georgia}.brand b span{color:#c32d3a}.tools{display:flex;gap:5px}button{background:#130d0b;color:#f0d49c;border:1px solid #8e692f;border-radius:7px;font-weight:900}.tools button{width:42px;height:38px}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}.dpad{width:118px;text-align:center;padding:7px}.dpad>button{width:44px;height:36px}.dpad div{display:flex;gap:6px;justify-content:center;margin:5px 0}.dpad div button{width:44px;height:36px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:245px;padding:7px}.rooms button{font-size:7px;padding:7px 3px}.hint{position:fixed;left:12px;bottom:150px;z-index:28;max-width:255px;font-size:9px;line-height:1.35}.hint b{color:#e0b45a}</style></head><body><div id="stage"><div id="world"><div id="base"></div></div></div><div class="hud"><div class="panel brand"><small>FULL TILT HQ · 29×27 ART PASS</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="minus">−</button><button id="plus">＋</button><button id="reset">⌂</button></div></div><div class="panel hint"><b>FIRST ART / ARCHITECTURE PASS</b><br>Casino Floor now has five full spaces toward Control, Kitchen, Back Office and Afterhours. Gold dots mark provisional emergency-light corridors. Eight pieces stress adjacent-cell spacing.</div><div class="bottom"><div class="panel dpad"><button id="up">▲</button><div><button id="left">◀</button><button id="right">▶</button></div><button id="down">▼</button></div><div class="panel rooms" id="roomButtons"></div></div><script>const C=29,R=27,T=82,base=document.getElementById('base'),rooms=[['VAULT',1,1,6,5],['CONTROL ROOM',12,1,6,5],['HIGH ROLLER ROOM',23,1,5,5],['BACK OFFICE',1,11,6,5],['CASINO FLOOR',12,11,6,5],['AFTERHOURS',23,11,5,5],['WORKSHOP',1,21,6,5],['KITCHEN',12,21,6,5],['BACK ROOM',23,21,5,5]],rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){let e=document.createElement('i'),n=rc.get(x+','+y),em=((x===8||x===9||x===20||x===21)&&y>=6&&y<=20);e.className='cell '+(n?'room ':'hall ')+(n==='CASINO FLOOR'?'casino ':'')+(em?'emergency':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';base.appendChild(e)}function add(cls,x,y,w,h){let e=document.createElement('i');e.className=cls;e.style.left=x+'px';e.style.top=y+'px';if(w)e.style.width=w+'px';if(h)e.style.height=h+'px';base.appendChild(e);return e}rooms.forEach(([n,x,y,w,h])=>{add('roomframe',(x-1)*T,(y-1)*T,w*T,h*T);let l=document.createElement('div');l.className='label';l.textContent=n;l.style.left=((x-1+w/2)*T)+'px';l.style.top=((y-1+h/2)*T)+'px';base.appendChild(l)});const props=[['prop',1.4,1.4,120,80],['prop',4.5,1.5,95,65],['prop blue',12.5,1.3,350,58],['prop blue',13.2,4.1,220,45],['prop green',24,2,150,105],['prop',1.5,11.7,145,80],['prop',5.2,11.5,48,150],['prop green',12.7,11.7,105,78],['prop green',16,14,95,65],['prop red',23.5,11.5,48,280],['prop red round',25.7,13,125,80],['prop',1.4,21.5,290,50],['prop',1.6,24.3,110,55],['prop',12.5,21.5,310,50],['prop',14,23.5,155,70],['prop',23.5,21.5,245,60],['prop',26.3,23.6,55,125]];props.forEach(([c,x,y,w,h])=>add(c,(x-1)*T,(y-1)*T,w,h));[[4,3],[25,23],[25,3],[4,23]].forEach(([x,y])=>{let e=add('pass',(x-.5)*T-14,(y-.5)*T-14,28,28);e.textContent='P'});const doors=[[6.9,3],[4,5.9],[11.9,3],[17.9,3],[15,5.9],[22.9,3],[25,5.9],[4,10.9],[6.9,13],[4,15.9],[25,10.9],[22.9,13],[25,15.9],[4,20.9],[6.9,23],[15,20.9],[11.9,23],[17.9,23],[25,20.9],[22.9,23]];doors.forEach(([x,y])=>add('door',x*T-19,y*T-4,38,8));let brand=document.createElement('div');brand.className='branding';brand.textContent='♠ FULL TILT HQ';brand.style.left=13*T+'px';brand.style.top=13*T+'px';base.appendChild(brand);[[13,12,0],[14,12,0],[15,12,0],[16,12,0],[13,13,1],[14,13,1],[15,13,1],[16,13,1]].forEach(([x,y,r])=>{let p=document.createElement('div');p.className='piece'+(r?' red':'');p.style.left=((x-.5)*T)+'px';p.style.top=((y-.5)*T)+'px';p.innerHTML='<i class="h"></i><i class="b"></i>';base.appendChild(p)});const world=document.getElementById('world'),stage=document.getElementById('stage');let sc=.4,px=0,py=0,drag=0,sx=0,sy=0;function draw(){world.style.transform=`translate(${px}px,${py}px) scale(${sc})`}function home(){sc=innerWidth<700?.34:.5;px=innerWidth/2-2300*sc;py=innerHeight/2-1650*sc;draw()}stage.addEventListener('pointerdown',e=>{drag=1;sx=e.clientX-px;sy=e.clientY-py;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag){px=e.clientX-sx;py=e.clientY-sy;draw()}});stage.addEventListener('pointerup',()=>drag=0);stage.addEventListener('pointercancel',()=>drag=0);const step=150;up.onclick=()=>{py+=step;draw()};down.onclick=()=>{py-=step;draw()};left.onclick=()=>{px+=step;draw()};right.onclick=()=>{px-=step;draw()};plus.onclick=()=>{sc=Math.min(1.3,sc*1.2);draw()};minus.onclick=()=>{sc=Math.max(.14,sc/1.2);draw()};reset.onclick=home;const rb=document.getElementById('roomButtons');rooms.forEach(([n,x,y,w,h])=>{let b=document.createElement('button');b.textContent=n.replace(' ROOM','');b.onclick=()=>{sc=Math.max(sc,.46);let bx=900+(x-1+w/2)*T,by=390+(y-1+h/2)*T;px=innerWidth/2-(bx-2300)*sc-2300*sc;py=innerHeight/2-(by-1650)*sc-1650*sc;draw()};rb.appendChild(b)});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',home);home();</script></body></html>
