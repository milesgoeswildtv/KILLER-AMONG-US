<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KILLER AMONG US — Geometry Validation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#f4dfb0;font-family:Arial,sans-serif}body{position:fixed;inset:0}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 44%,#2c0d12,#090605 55%,#020202)}#world{position:absolute;left:50%;top:50%;width:4600px;height:3500px;transform-origin:0 0}#board{position:absolute;left:1111px;top:640px;width:2378px;height:2214px;transform-style:preserve-3d;transform-origin:50% 50%;transition:transform .35s ease}.cell{position:absolute;width:82px;height:82px;border:1px solid #59462e;background:#171310;box-shadow:inset 0 0 9px #000}.cell.alt{background:#1d1814}.cell.room{background:#33251b;border-color:#8a6735}.cell.casino{background:#5b141d;border-color:#bd8040}.cell.perim{background:#0d0d0c;border-color:#665236}.cell.em{box-shadow:inset 0 0 24px #9e5120}.cell.em:after{content:"";position:absolute;inset:30px;border-radius:50%;background:#e3ad4f;box-shadow:0 0 13px #e3ad4f}.roomframe{position:absolute;border:5px solid #c79843;pointer-events:none;z-index:4}.label{position:absolute;z-index:12;transform:translate(-50%,-50%);background:#070504e8;border:2px solid #bd8d3c;border-radius:5px;padding:6px 9px;color:#f1d9a4;font:900 10px Georgia;white-space:nowrap;letter-spacing:.06em}.marker{position:absolute;z-index:18;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#080808;border:5px solid #e0ae50;box-shadow:0 8px 8px #000,0 0 0 3px #120c08}.marker.red{border-color:#ca3444}.marker:after{content:"";position:absolute;left:50%;top:-35px;transform:translateX(-50%);width:28px;height:38px;border-radius:50% 50% 38% 38%;background:#111;border:4px solid inherit}.marker.selected{box-shadow:0 0 0 7px #fff7,0 8px 8px #000}.coord{position:absolute;z-index:25;transform:translate(-50%,-50%) rotateZ(45deg) rotateX(-57deg);font:900 10px monospace;background:#000d;color:#fff;border:1px solid #d6a64c;padding:3px 5px;border-radius:4px;pointer-events:none}.hud{position:fixed;left:10px;right:10px;top:max(9px,env(safe-area-inset-top));z-index:50;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#080606e9;border:1px solid #8f6a31;border-radius:10px;padding:8px 10px;box-shadow:0 7px 20px #000;pointer-events:auto}.brand small{display:block;font-size:8px;color:#b68b48;letter-spacing:.16em}.brand b{font:900 17px Georgia}.brand span{color:#c52d3b}.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:225px}button{background:#160e0b;color:#f2d8a1;border:1px solid #8e692f;border-radius:7px;font-weight:900;min-height:36px}.tools button{min-width:39px;padding:0 8px}.status{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:50;max-width:300px;font-size:10px;line-height:1.35}.status b{color:#e3b458}.legend{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:50;font-size:9px;max-width:175px}.ok{color:#75df8b}.warn{color:#ffcf64}</style></head><body><div id="stage"><div id="world"><div id="board"></div></div></div><div class="hud"><div class="panel brand"><small>FULL TILT HQ · GEOMETRY VALIDATION</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="rotL">↶90°</button><button id="rotR">↷90°</button><button id="minus">−</button><button id="plus">＋</button><button id="home">⌂</button></div></div><div class="panel status" id="status"><b>29×27 MASTER</b><br>Tap any tile to place the white-ring test piece on its exact center.</div><div class="panel legend"><b>VALIDATION BUILD</b><br><span class="ok">✓</span> 1-tile perimeter all sides<br><span class="ok">✓</span> 5-wide WEST/EAST zones<br><span class="ok">✓</span> 90° rotation<br><span class="ok">✓</span> exact tile-center placement<br><span class="warn">●</span> 8 adjacent pieces = spacing stress test</div><script>const C=29,R=27,T=82,board=document.getElementById('board'),rooms=[['VAULT',2,2,6,5],['CONTROL ROOM',13,2,6,5],['HIGH ROLLER ROOM',24,2,5,5],['BACK OFFICE',2,12,6,5],['CASINO FLOOR',13,12,6,5],['AFTERHOURS',24,12,5,5],['WORKSHOP',2,22,6,5],['KITCHEN',13,22,6,5],['BACK ROOM',24,22,5,5]],rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});function center(x,y){return[(x-.5)*T,(y-.5)*T]}for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){let e=document.createElement('i'),n=rc.get(x+','+y),per=x===1||x===C||y===1||y===R,em=(((x>=8&&x<=12)||(x>=19&&x<=23))&&y>=7&&y<=21);e.className='cell '+(per?'perim ':'')+(n?'room ':'')+(n==='CASINO FLOOR'?'casino ':'')+(em?'em ':'')+((x+y)%2?'alt':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';e.dataset.x=x;e.dataset.y=y;e.onclick=ev=>{ev.stopPropagation();placeSelected(x,y,n)};board.appendChild(e)}rooms.forEach(([n,x,y,w,h])=>{let f=document.createElement('i');f.className='roomframe';f.style.left=(x-1)*T+'px';f.style.top=(y-1)*T+'px';f.style.width=w*T+'px';f.style.height=h*T+'px';board.appendChild(f);let l=document.createElement('div');l.className='label';l.textContent=n;l.style.left=(x-1+w/2)*T+'px';l.style.top=(y-1+h/2)*T+'px';board.appendChild(l)});function mkPiece(x,y,red=false,sel=false){let p=document.createElement('div');p.className='marker'+(red?' red':'')+(sel?' selected':'');let[cx,cy]=center(x,y);p.style.left=cx+'px';p.style.top=cy+'px';board.appendChild(p);return p}const stress=[[14,13],[15,13],[16,13],[17,13],[14,14],[15,14],[16,14],[17,14]];stress.forEach((p,i)=>mkPiece(p[0],p[1],i>=4));let selected=mkPiece(15,15,false,true),coord=document.createElement('div');coord.className='coord';board.appendChild(coord);function placeSelected(x,y,n){let[cx,cy]=center(x,y);selected.style.left=cx+'px';selected.style.top=cy+'px';coord.style.left=cx+'px';coord.style.top=(cy+43)+'px';coord.textContent=`${x},${y}`;status.innerHTML=`<b>TILE ${x},${y}</b><br>${n||((x===1||x===29||y===1||y===27)?'PERIMETER':'CORRIDOR')} · exact mathematical center`;counterRotate()}placeSelected(15,15,'CASINO FLOOR');const world=document.getElementById('world'),stage=document.getElementById('stage');let sc=.34,px=0,py=0,drag=0,sx=0,sy=0,turn=0;function boardTransform(){board.style.transform=`rotateX(57deg) rotateZ(${(-45+turn)}deg)`;counterRotate()}function counterRotate(){document.querySelectorAll('.marker,.label,.coord').forEach(e=>{e.style.transform=`translate(-50%,-50%) rotateZ(${45-turn}deg) rotateX(-57deg)`})}function draw(){world.style.transform=`translate(${px}px,${py}px) scale(${sc})`}function reset(){sc=innerWidth<700?.32:.46;px=innerWidth/2-2300*sc;py=innerHeight/2-1750*sc;draw()}rotL.onclick=()=>{turn=(turn-90)%360;boardTransform()};rotR.onclick=()=>{turn=(turn+90)%360;boardTransform()};plus.onclick=()=>{sc=Math.min(1.25,sc*1.18);draw()};minus.onclick=()=>{sc=Math.max(.14,sc/1.18);draw()};home.onclick=reset;stage.addEventListener('pointerdown',e=>{if(e.target.classList.contains('cell'))return;drag=1;sx=e.clientX-px;sy=e.clientY-py;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag){px=e.clientX-sx;py=e.clientY-sy;draw()}});stage.addEventListener('pointerup',()=>drag=0);stage.addEventListener('pointercancel',()=>drag=0);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',reset);boardTransform();reset();</script></body></html>
