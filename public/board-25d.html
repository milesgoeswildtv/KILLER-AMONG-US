<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KILLER AMONG US — 2.5D HQ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#f7e6bd;font-family:Arial,sans-serif}.stage{position:fixed;inset:0;touch-action:none;background:radial-gradient(circle at 50% 45%,#28120b,#070504 70%)}.world{position:absolute;left:50%;top:50%;width:1180px;height:900px;transform-origin:50% 50%;transform-style:preserve-3d}.board{position:absolute;inset:55px 55px 70px;transform-style:preserve-3d;transform:rotateX(54deg) rotateZ(-45deg);border:4px solid #a97828;background:#100b08;box-shadow:0 70px 100px #000,0 0 0 12px #050403,0 0 0 16px #5e421e;clip-path:polygon(9% 0,91% 0,100% 12%,100% 88%,91% 100%,9% 100%,0 88%,0 12%)}.floor{position:absolute;inset:18px;background:repeating-linear-gradient(90deg,#160e0a 0 34px,#1b120d 34px 68px);border:1px solid #61431f}.room{position:absolute;border:3px solid #765124;background:linear-gradient(145deg,#21140e,#0d0907);box-shadow:inset 0 0 35px #000,8px 10px 0 #070504,14px 17px 24px #000;transform:translateZ(18px);overflow:hidden}.room:before,.room:after{content:"";position:absolute;background:#372115}.room:before{left:0;right:0;top:0;height:10px;border-bottom:1px solid #8f672e}.room h3{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotateZ(45deg) rotateX(-54deg);margin:0;padding:5px 10px;background:#080604dd;border:1px solid #d0a24d;color:#f3d99d;font:700 16px Georgia;letter-spacing:.08em;white-space:nowrap;text-shadow:0 2px 3px #000;z-index:4}.prop{position:absolute;border:2px solid #6f4c22;background:#18100c;box-shadow:4px 5px 0 #070504}.table{border-radius:50%;background:#300b0b;border-color:#b38234}.screen{background:#061724;border-color:#3d84aa;box-shadow:0 0 15px #148fd955}.vaultdoor{border-radius:50%;background:radial-gradient(circle,#58452b,#18130d 58%,#8e6a2f 60%,#1a120a 67%)}.bar{background:linear-gradient(#4b1119,#19080b);border-color:#a33b4a}.counter{background:#352318}.crate{background:#20170e}.casino{border-color:#c89a42;background:radial-gradient(circle,#4a0b10,#17090a 72%);box-shadow:inset 0 0 45px #000,8px 10px 0 #070504,0 0 28px #8d151555}.casino h3{font-size:20px}.casino .core{position:absolute;left:50%;top:50%;width:90px;height:90px;transform:translate(-50%,-50%);border-radius:50%;border:7px solid #bd8b35;background:#090706;box-shadow:0 0 25px #c68e36}.casino .core:after{content:'♠';position:absolute;inset:0;display:grid;place-items:center;color:#d2a54f;font-size:45px}.hall{position:absolute;background:#29160d;border:2px solid #62421d;transform:translateZ(8px);box-shadow:inset 0 0 12px #000}.piece{position:absolute;width:34px;height:48px;z-index:20;transform:translate(-50%,-80%) translateZ(50px) rotateZ(45deg) rotateX(-54deg);filter:drop-shadow(0 8px 5px #000)}.piece .head{width:30px;height:30px;border-radius:50%;background:#090807;border:3px solid #d4a64e;display:grid;place-items:center;font-size:17px}.piece .base{width:34px;height:12px;border-radius:50%;background:#080706;border:2px solid #d4a64e;margin-top:-2px}.piece label{position:absolute;left:50%;top:38px;transform:translateX(-50%);font-size:9px;background:#050403dd;padding:2px 4px;border:1px solid #80602c;white-space:nowrap}.hud{position:fixed;z-index:100;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.brand{pointer-events:auto;text-shadow:0 2px 8px #000}.brand small{display:block;letter-spacing:.22em;color:#b99454;font-size:9px}.brand b{font:900 25px Georgia}.brand span{color:#c52d38}.tools{pointer-events:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tools button{border:1px solid #8b672d;background:#100b08e8;color:#f3d99d;border-radius:8px;padding:7px 9px;font-weight:800;font-size:10px}.legend{position:fixed;z-index:90;left:12px;bottom:12px;background:#090604e8;border:1px solid #795625;padding:9px 11px;border-radius:10px;font-size:10px;max-width:330px}.legend b{color:#e6b957}.door{position:absolute;width:30px;height:8px;background:#d4a84d;box-shadow:0 0 10px #e0ae45;z-index:10;transform:translateZ(25px)}@media(max-width:700px){.brand b{font-size:17px}.legend{max-width:230px;font-size:8px}.tools button{padding:6px;font-size:8px}}</style></head><body><div class="hud"><div class="brand"><small>FULL TILT HQ · 2.5D LAB</small><b>KILLER <span>AMONG US</span></b></div><div class="tools"><button id="out">−</button><button id="in">＋</button><button id="left">↺</button><button id="right">↻</button><button id="reset">RESET</button></div></div><div class="stage" id="stage"><div class="world" id="world"><div class="board" id="board"><div class="floor"></div></div></div></div><div class="legend"><b>LIVE 2.5D BOARD LAB</b><br>Drag to pan · pinch/wheel to zoom · rotate the entire HQ. Nine correct rooms, central Casino Floor, raised walls/props, corridors, doors and a test piece.</div><script>const board=document.getElementById('board');const defs=[['VAULT',4,4,27,25,'vault'],['CONTROL ROOM',36.5,4,27,25,'control'],['HIGH ROLLER ROOM',69,4,27,25,'high'],['BACK OFFICE',4,37.5,27,25,'office'],['CASINO FLOOR',36.5,37.5,27,25,'casino'],['AFTERHOURS',69,37.5,27,25,'after'],['WORKSHOP',4,71,27,25,'work'],['KITCHEN',36.5,71,27,25,'kitchen'],['BACK ROOM',69,71,27,25,'back']];const rooms={};defs.forEach(([name,x,y,w,h,id])=>{let r=document.createElement('div');r.className='room '+(id==='casino'?'casino':'');r.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;r.innerHTML=`<h3>${name}</h3>`;board.appendChild(r);rooms[id]=r});function prop(r,cls,l,t,w,h){let p=document.createElement('i');p.className='prop '+cls;p.style.cssText=`left:${l}%;top:${t}%;width:${w}%;height:${h}%`;r.appendChild(p)}prop(rooms.vault,'vaultdoor',8,18,28,55);prop(rooms.vault,'crate',55,14,14,20);prop(rooms.vault,'crate',72,14,14,20);prop(rooms.control,'screen',9,9,24,18);prop(rooms.control,'screen',38,9,24,18);prop(rooms.control,'screen',67,9,24,18);prop(rooms.control,'counter',18,66,64,14);prop(rooms.high,'table',34,30,34,38);prop(rooms.high,'table',7,62,20,22);prop(rooms.high,'table',74,62,20,22);prop(rooms.office,'counter',9,15,26,16);prop(rooms.office,'counter',61,15,26,16);prop(rooms.office,'crate',10,67,17,19);prop(rooms.office,'crate',72,67,17,19);prop(rooms.after,'bar',8,10,18,75);prop(rooms.after,'table',43,22,23,27);prop(rooms.after,'table',68,57,18,21);prop(rooms.work,'counter',8,12,70,13);prop(rooms.work,'crate',10,60,17,20);prop(rooms.work,'crate',34,60,17,20);prop(rooms.work,'crate',58,60,17,20);prop(rooms.kitchen,'counter',8,10,84,14);prop(rooms.kitchen,'counter',8,70,84,14);prop(rooms.kitchen,'table',36,34,28,32);prop(rooms.back,'crate',8,12,18,25);prop(rooms.back,'crate',31,12,18,25);prop(rooms.back,'crate',54,12,18,25);prop(rooms.back,'counter',15,68,70,14);let core=document.createElement('div');core.className='core';rooms.casino.appendChild(core);[[15,18],[65,18],[15,66],[65,66]].forEach(([x,y])=>prop(rooms.casino,'table',x,y,20,22));const halls=[[31,14,5.5,6],[63.5,14,5.5,6],[31,47.5,5.5,6],[63.5,47.5,5.5,6],[31,81,5.5,6],[63.5,81,5.5,6],[14,29,6,8.5],[46.5,29,6,8.5],[79,29,6,8.5],[14,62.5,6,8.5],[46.5,62.5,6,8.5],[79,62.5,6,8.5]];halls.forEach(([x,y,w,h])=>{let e=document.createElement('div');e.className='hall';e.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;board.appendChild(e)});[['31.8','16.5'],['64.3','16.5'],['31.8','50'],['64.3','50'],['31.8','83.5'],['64.3','83.5']].forEach(([x,y])=>{let d=document.createElement('div');d.className='door';d.style.cssText=`left:${x}%;top:${y}%`;board.appendChild(d)});let pc=document.createElement('div');pc.className='piece';pc.style.cssText='left:50%;top:51%';pc.innerHTML='<div class="head">♠</div><div class="base"></div><label>TEST PIECE</label>';board.appendChild(pc);let scale=.72,rot=0,px=-590,py=-450,drag=false,sx=0,sy=0;const world=document.getElementById('world'),stage=document.getElementById('stage');function draw(){world.style.transform=`translate(${px}px,${py}px) scale(${scale})`;board.style.transform=`rotateX(54deg) rotateZ(${-45+rot}deg)`}stage.onpointerdown=e=>{drag=true;sx=e.clientX-px;sy=e.clientY-py;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(drag){px=e.clientX-sx;py=e.clientY-sy;draw()}};stage.onpointerup=()=>drag=false;stage.onwheel=e=>{e.preventDefault();scale=Math.max(.35,Math.min(1.6,scale*(e.deltaY>0?.9:1.1)));draw()};in.onclick=()=>{scale=Math.min(1.6,scale*1.15);draw()};out.onclick=()=>{scale=Math.max(.35,scale/1.15);draw()};left.onclick=()=>{rot-=90;draw()};right.onclick=()=>{rot+=90;draw()};reset.onclick=()=>{scale=innerWidth<700?.48:.72;rot=0;px=-590;py=-450;draw()};scale=innerWidth<700?.48:.72;draw();</script></body></html>
