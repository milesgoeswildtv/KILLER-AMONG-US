<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KILLER AMONG US — 2.5D HQ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050404;color:#f2ddb2;font-family:Arial,sans-serif;overscroll-behavior:none}body{position:fixed;inset:0}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 45%,#38131a,#090606 58%,#030303)}#world{position:absolute;left:50%;top:50%;width:4200px;height:2800px;transform-origin:0 0}.hud{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#080606e8;border:1px solid #8e692f;border-radius:10px;padding:9px 11px;box-shadow:0 8px 22px #000;pointer-events:auto}.brand small{display:block;color:#b98d49;font-size:8px;letter-spacing:.2em}.brand b{font:900 19px Georgia}.brand b span{color:#c32d3a}.tools{display:flex;gap:5px}.tools button,.dpad button,.rooms button{background:#130d0b;color:#f0d49c;border:1px solid #8e692f;border-radius:7px;font-weight:900}.tools button{width:42px;height:38px}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}.dpad{width:118px;text-align:center;padding:7px}.dpad>button{width:44px;height:36px}.dpad div{display:flex;gap:6px;justify-content:center;margin:5px 0}.dpad div button{width:44px;height:36px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:245px;padding:7px}.rooms button{font-size:7px;padding:7px 3px}.board{position:absolute;left:0;top:0;width:4200px;height:2800px}.base{position:absolute;left:850px;top:350px;width:2500px;height:1900px;transform:rotateX(58deg) rotateZ(-45deg);transform-style:preserve-3d;background:#0d0a08;border:6px solid #a97931;box-shadow:0 80px 120px #000;clip-path:polygon(8% 0,92% 0,100% 10%,100% 90%,92% 100%,8% 100%,0 90%,0 10%)}.cell{position:absolute;width:76px;height:76px;border:1px solid #5c492c;background:#15110e}.roomcell{background:#221712;border-color:#7b5e31}.casino{background:#3d0e14;border-color:#9d5530}.cell:after{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid #65594166}.wall{position:absolute;background:#241712;border:2px solid #805d2b;box-shadow:6px 8px 0 #060504;z-index:6}.label{position:absolute;z-index:9;background:#070606e8;border:1px solid #c79742;color:#efd69f;padding:5px 8px;font:900 10px Georgia;white-space:nowrap;transform:translate(-50%,-50%)}.prop{position:absolute;z-index:5;background:#211812;border:2px solid #987033;box-shadow:4px 5px 0 #050403}.piece{position:absolute;z-index:12;width:42px;height:58px;transform:translate(-50%,-82%)}.piece .head{width:24px;height:24px;border-radius:50%;background:#080707;border:3px solid #d0a24a;margin:auto}.piece .body{width:30px;height:35px;background:#080707;border:3px solid #d0a24a;margin:-2px auto 0;border-radius:10px 10px 4px 4px}.piece.red .head,.piece.red .body{border-color:#bd2c3a}.pass{position:absolute;z-index:10;width:26px;height:26px;border-radius:50%;background:#070606;border:5px solid #b52b38;display:grid;place-items:center;font-size:9px;font-weight:900}.door{position:absolute;z-index:10;width:34px;height:7px;background:#e0b353;box-shadow:0 0 10px #e0b353}.hint{position:fixed;left:12px;bottom:150px;z-index:18;max-width:250px;font-size:9px;line-height:1.35}.hint b{color:#e0b45a}@media(min-width:800px){.hint{bottom:12px;max-width:360px}.bottom{left:auto;right:12px;width:auto}.rooms{max-width:300px}.brand b{font-size:24px}}</style></head><body><div id="stage"><div id="world"><div class="board"><div class="base" id="base"></div></div></div></div><div class="hud"><div class="panel brand"><small>FULL TILT HQ · PLAYABLE 2.5D PROTOTYPE</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="minus">−</button><button id="plus">＋</button><button id="reset">⌂</button></div></div><div class="panel hint"><b>REAL WEB PROTOTYPE</b><br>Use the arrows or drag the board. Zoom with +/−. Tap any room name below to jump there. Eight test pieces are packed together in Casino Floor to stress spacing.</div><div class="bottom"><div class="panel dpad"><button id="up">▲</button><div><button id="left">◀</button><button id="right">▶</button></div><button id="down">▼</button></div><div class="panel rooms" id="roomButtons"></div></div><script>const C=29,R=23,T=76,base=document.getElementById('base'),rooms=[['VAULT',1,1,6,5],['CONTROL ROOM',12,1,6,5],['HIGH ROLLER ROOM',23,1,5,5],['BACK OFFICE',1,9,6,5],['CASINO FLOOR',12,9,6,5],['AFTERHOURS',23,9,5,5],['WORKSHOP',1,17,6,5],['KITCHEN',12,17,6,5],['BACK ROOM',23,17,5,5]],rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){let e=document.createElement('i');let n=rc.get(x+','+y);e.className='cell '+(n?'roomcell ':'')+(n==='CASINO FLOOR'?'casino':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';base.appendChild(e)}function add(cls,x,y,w,h){let e=document.createElement('i');e.className=cls;e.style.left=x+'px';e.style.top=y+'px';if(w)e.style.width=w+'px';if(h)e.style.height=h+'px';base.appendChild(e);return e}rooms.forEach(([n,x,y,w,h])=>{let l=document.createElement('div');l.className='label';l.textContent=n;l.style.left=((x-1+w/2)*T)+'px';l.style.top=((y-1+h/2)*T)+'px';base.appendChild(l);add('wall',(x-1)*T,(y-1)*T,w*T,12);add('wall',(x-1)*T,(y-1)*T,12,h*T)});const props=[[1.4,1.5,110,65],[4.4,1.4,85,55],[12.7,1.3,270,55],[13.5,4.1,190,45],[24.1,2.0,130,95],[1.5,9.7,125,70],[5.1,9.5,45,130],[12.7,9.7,95,75],[16.0,12.0,90,60],[23.5,9.6,45,250],[25.9,11.7,105,65],[1.4,17.5,260,48],[12.5,17.5,290,48],[14.0,19.4,140,58],[23.5,17.5,220,55]];props.forEach(([x,y,w,h])=>add('prop',(x-1)*T,(y-1)*T,w,h));[[4,3],[25,19],[25,3],[4,19]].forEach(([x,y])=>{let e=add('pass',(x-.5)*T-13,(y-.5)*T-13,26,26);e.textContent='P'});const ds=[[6.9,3],[4,5.9],[11.9,3],[17.9,3],[15,5.9],[22.9,3],[25,5.9],[4,8.9],[6.9,11],[4,13.9],[25,8.9],[22.9,11],[25,13.9],[4,16.9],[6.9,19],[15,16.9],[11.9,19],[17.9,19],[25,16.9],[22.9,19]];ds.forEach(([x,y])=>add('door',x*T-17,y*T-3,34,7));[[13,10,0],[14,10,0],[15,10,0],[16,10,0],[13,11,1],[14,11,1],[15,11,1],[16,11,1]].forEach(([x,y,r])=>{let p=document.createElement('div');p.className='piece'+(r?' red':'');p.style.left=((x-.5)*T)+'px';p.style.top=((y-.5)*T)+'px';p.innerHTML='<div class="head"></div><div class="body"></div>';base.appendChild(p)});const world=document.getElementById('world'),stage=document.getElementById('stage');let sc=.42,px=0,py=0,drag=0,sx=0,sy=0;function draw(){world.style.transform=`translate(${px}px,${py}px) scale(${sc})`}function home(){sc=innerWidth<700?.36:.52;px=innerWidth/2-2100*sc;py=innerHeight/2-1400*sc;draw()}stage.addEventListener('pointerdown',e=>{drag=1;sx=e.clientX-px;sy=e.clientY-py;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag){px=e.clientX-sx;py=e.clientY-sy;draw()}});stage.addEventListener('pointerup',()=>drag=0);stage.addEventListener('pointercancel',()=>drag=0);const step=140;up.onclick=()=>{py+=step;draw()};down.onclick=()=>{py-=step;draw()};left.onclick=()=>{px+=step;draw()};right.onclick=()=>{px-=step;draw()};plus.onclick=()=>{sc=Math.min(1.3,sc*1.2);draw()};minus.onclick=()=>{sc=Math.max(.16,sc/1.2);draw()};reset.onclick=home;const rb=document.getElementById('roomButtons');rooms.forEach(([n,x,y,w,h])=>{let b=document.createElement('button');b.textContent=n.replace(' ROOM','');b.onclick=()=>{sc=Math.max(sc,.48);let bx=850+((x-1+w/2)*T),by=350+((y-1+h/2)*T);px=innerWidth/2-(bx-2100)*sc-2100*sc;py=innerHeight/2-(by-1400)*sc-1400*sc;draw()};rb.appendChild(b)});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',home);home();</script></body></html>
