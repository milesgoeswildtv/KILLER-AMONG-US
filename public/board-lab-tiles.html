<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KILLER AMONG US — HQ Systems Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407;color:#eee;font-family:Inter,Arial,sans-serif}button{font:inherit}.hud{position:fixed;z-index:80;inset:0 0 auto 0;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;background:linear-gradient(#08060bfa,#08060bd5,transparent);pointer-events:none}.brand,.tools{pointer-events:auto}.brand small{display:block;font-size:8px;font-weight:900;letter-spacing:.2em;color:#b795c3}.brand b{font:800 clamp(16px,3.5vw,27px) Georgia,serif}.brand span{color:#ce5cef}.tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:68vw}.tools button,.systems button{border:1px solid #5b3e63;background:#16101b;color:#eee;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:900}.tools button.on,.systems button.on{border-color:#e4bf77;color:#ffe0a1;background:#3d2e19}.stage{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;cursor:grab}.stage.dragging{cursor:grabbing}.world{will-change:transform;backface-visibility:hidden;transform:translate3d(0,0,0)}.world{position:absolute;left:50%;top:50%;width:1420px;height:1120px;transform-origin:center}.table{position:absolute;inset:0;border-radius:58px;background:radial-gradient(circle,#1b1021,#08060b 73%);border:2px solid #34213c;box-shadow:0 65px 145px #000,inset 0 0 100px #000}.shell{position:absolute;left:110px;top:95px;width:1200px;height:930px;perspective:1600px}.board{position:absolute;width:1140px;height:850px;transform-origin:50% 50%;transform-style:preserve-3d;border:3px solid #9a7438;border-radius:27px;background:#09070b;box-shadow:0 38px 80px #000d,0 0 0 8px #09070b,0 0 0 11px #47371f;overflow:visible;transition:transform .45s ease}.grid{position:absolute;inset:24px;display:grid;grid-template-columns:repeat(29,1fr);grid-template-rows:repeat(23,1fr);gap:2px;transform:translateZ(3px)}.tile{position:relative;border:1px solid #201b24;background:#070609;border-radius:2px;transition:background .18s,border .18s,box-shadow .18s,opacity .18s;cursor:pointer;opacity:.11}.tile.hall{background:#0b080e}.tile.roomfloor{background:#0d0910}.tile.casinofloor{background:#120816}.tile.seen{border-color:#3b3040}.tile.lit6{opacity:.38;background:#17101b}.tile.lit5{opacity:.50;background:#1b121f}.tile.lit4{opacity:.63;background:#201524}.tile.lit3{opacity:.76;background:#25182a}.tile.lit2{opacity:.89;background:#2b1b31}.tile.lit1{opacity:.97;border-color:#6d4f75;background:#321f39}.tile.lit0{opacity:1;border-color:#8b5e96;background:#412448;box-shadow:0 0 15px #c56bdd38}.tile.reachable{border-color:#d583ea;background:#3c2046;box-shadow:0 0 9px #c958e77a;opacity:1}.tile.path{border-color:#f0d18e;background:#4b3920;box-shadow:0 0 10px #f0c96b88;opacity:1}.tile.current{border-color:#ff89ff;background:#582560;box-shadow:0 0 15px #dc62ff;opacity:1}.tile.emergency{opacity:1!important;border-color:#ffe7a8!important;background:#705c29!important;box-shadow:0 0 22px #fff2b9!important}.room{position:absolute;transform:translateZ(9px);pointer-events:none;border:2px solid #4b3851;background:#100b14a8;box-shadow:inset 0 0 30px #000b,0 7px 0 #060507;transform-style:preserve-3d}.room:before{content:"";position:absolute;left:-2px;right:-2px;top:-14px;height:14px;background:#24182a;border:1px solid #54395c;transform-origin:bottom;transform:rotateX(-90deg)}.room:after{content:"";position:absolute;right:-14px;top:-2px;bottom:-2px;width:14px;background:#160e1b;border:1px solid #47304f;transform-origin:left;transform:rotateY(90deg)}.room h3{position:absolute;left:9px;top:7px;margin:0;font-size:13px;letter-spacing:.06em;text-shadow:0 2px 4px #000;transform-origin:center;transition:transform .45s ease;white-space:nowrap}.room.center{border-color:#a968b5;background:#291231aa}.door{position:absolute;z-index:8;transition:.25s}.door.open{background:#dfbb70;box-shadow:0 0 13px #ffd782}.door.closed{background:#5b2630;box-shadow:0 0 8px #9b263d}.door.n,.door.s{width:34px;height:6px;left:50%;translate:-50% 0}.door.n{top:-4px}.door.s{bottom:-4px}.door.e,.door.w{height:34px;width:6px;top:50%;translate:0 -50%}.door.e{right:-4px}.door.w{left:-4px}.passage{position:absolute;z-index:20;transform:translate(-50%,-50%) translateZ(16px);width:22px;height:22px;border-radius:50%;border:2px solid #78528a;background:#100a15;opacity:.25;pointer-events:none}.passage.on{opacity:1;border-color:#d886f2;box-shadow:0 0 18px #d45aff;background:#381a43}.piece{position:absolute;width:48px;height:63px;z-index:35;transform:translate(-50%,-78%) translateZ(34px);pointer-events:none;filter:drop-shadow(0 10px 5px #000a);transition:left .17s linear,top .17s linear,opacity .16s}.piece .art{position:absolute;left:50%;bottom:9px;translate:-50%;width:34px;height:45px;border:2px solid #ef82ff;border-radius:10px;background:#151019;display:grid;place-items:center;font-size:23px;box-shadow:0 0 20px #d75cff}.piece.player-asset{width:64px;height:82px;transform:translate(-50%,-76%) translateZ(38px);filter:drop-shadow(0 12px 7px #000c)}.piece.player-asset .art{left:50%;bottom:5px;width:64px;height:72px;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:visible}.piece.player-asset .art img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px #d75cff55)}.piece.player-asset .base{display:none}.piece.player-asset .name{bottom:-9px;border-color:#b780c1;color:#fff;background:#070509ee}.piece .base{position:absolute;left:8px;bottom:0;width:32px;height:13px;border-radius:50%;background:#0b090d;border:2px solid #cfa24e}.piece .name{position:absolute;left:50%;bottom:-12px;translate:-50%;background:#070509e8;border:1px solid #65476e;border-radius:5px;padding:2px 5px;font-size:7px;font-weight:900;white-space:nowrap;transform-origin:center;transition:transform .45s ease}.piece.test{opacity:0}.piece.test.visible{opacity:1}.piece.test .art{border-color:#d7b56d;box-shadow:0 0 13px #d9af5b77;font-size:18px}.systems{position:fixed;z-index:65;left:12px;bottom:12px;width:min(490px,calc(100vw - 24px));padding:10px;border:1px solid #51365c;border-radius:12px;background:#0b0810f2}.systems .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.systems p{margin:6px 0 0;color:#aa96b1;font-size:9px}.rollbox{position:fixed;z-index:66;right:12px;bottom:12px;padding:10px 12px;border:1px solid #6b4b77;border-radius:12px;background:#0b0810f2;min-width:205px}.die{font-size:22px;font-weight:1000;color:#efcc80}.rollbox p{margin:3px 0 0;color:#a996b0;font-size:9px}.compass{position:fixed;z-index:64;right:16px;top:76px;width:45px;height:45px;border:1px solid #765884;border-radius:50%;background:#0a0710e8;display:grid;place-items:center;font:900 12px Georgia;color:#efcc80}.compass:before{content:"▲";position:absolute;top:2px;color:#e96b74;font-size:9px}.note{position:absolute;right:24px;top:18px;transform:translateZ(13px);font-size:8px;color:#d5bcde;background:#0c0911cc;border:1px solid #5c4164;border-radius:7px;padding:5px 7px}@media(max-width:720px){.shell{left:110px;top:95px}.systems{left:8px;bottom:8px;width:290px}.rollbox{right:8px;bottom:8px;min-width:135px}.room h3{font-size:11px}}
</style></head><body>
<div class="hud"><div class="brand"><small>FULL TILT HQ · SYSTEMS LAB</small><b>KILLER <span>AMONG US</span></b></div><div class="tools"><button id="zoomOut">−</button><button id="zoomIn">＋</button><button id="reset">RESET</button><button id="rotL">↺ ROTATE</button><button id="rotR">ROTATE ↻</button><button id="roll">ROLL d6</button></div></div>
<div class="compass" id="compass">N</div><div class="stage" id="stage"><div class="world" id="world"><div class="table"></div><div class="shell"><div class="board" id="board"><div class="grid" id="grid"></div><div class="note">29×23 SCALE TEST · WALL-AWARE FOG · 6 SPACE AWARENESS</div></div></div></div></div>
<div class="systems"><small>ROOM SYSTEM TEST CONTROLS</small><div class="row"><button id="route" class="on">DOORS: MAIN</button><button id="passages">PASSAGES: OFF</button><button id="west">WEST LIGHTS</button><button id="east">EAST LIGHTS</button><button id="lightsOff">LIGHTS OFF</button></div><p>SCALE TEST: expanded to 29×23 with longer corridors and more meaningful d6 travel. Sam uses the actual THE FIRESTARTER piece.</p></div>
<div class="rollbox"><div class="die" id="die">ROLL —</div><p id="status">Move through the dark HQ.</p></div>
<script>
const COLS=29,ROWS=23,VISION=6,grid=document.getElementById('grid'),board=document.getElementById('board');const tiles=new Map(),graph=new Map(),cellType=new Map(),roomEls=new Map(),testPieces=[],key=(x,y)=>x+','+y,parse=k=>k.split(',').map(Number);
const roomDefs=[{id:'vault',name:'THE VAULT',x:1,y:1,w:6,h:5,physical:['e','s'],main:['e'],side:['s']},{id:'control',name:'CONTROL ROOM',x:12,y:1,w:6,h:5,physical:['w','e','s'],main:['s'],side:['w','e']},{id:'high',name:'HIGH ROLLER',x:23,y:1,w:5,h:5,physical:['w','s'],main:['s'],side:['w']},{id:'office',name:'BACK OFFICE',x:1,y:9,w:6,h:5,physical:['n','e','s'],main:['e'],side:['n','s']},{id:'casino',name:'CASINO FLOOR',x:12,y:9,w:6,h:5,physical:[],main:[],side:[],center:true},{id:'after',name:'AFTERHOURS',x:23,y:9,w:5,h:5,physical:['n','w','s'],main:['w'],side:['n','s']},{id:'workshop',name:'WORKSHOP',x:1,y:17,w:6,h:5,physical:['n','e'],main:['n'],side:['e']},{id:'kitchen',name:'KITCHEN',x:12,y:17,w:6,h:5,physical:['n','w','e'],main:['n'],side:['w','e']},{id:'back',name:'BACK ROOM',x:23,y:17,w:5,h:5,physical:['n','w'],main:['w'],side:['n']}];
const roomAt=(x,y)=>roomDefs.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const k=key(x,y),r=roomAt(x,y),t=document.createElement('div');t.className='tile '+(r?(r.center?'casinofloor':'roomfloor'):'hall');grid.appendChild(t);tiles.set(k,t);cellType.set(k,r?.id||'hall');graph.set(k,new Set())}
let routing='main',passages=false,emergency=null,rotation=0,current=key(15,11),budget=0,reachable=new Map(),moving=false;
function activeDirs(r){if(r.center)return['n','e','s','w'];return routing==='main'?r.main:r.side}function doorCell(r,d){const cx=r.x+Math.floor(r.w/2),cy=r.y+Math.floor(r.h/2);if(d==='n')return key(cx,r.y);if(d==='s')return key(cx,r.y+r.h-1);if(d==='w')return key(r.x,cy);return key(r.x+r.w-1,cy)}function activeDoorMap(){const m=new Map();roomDefs.forEach(r=>m.set(r.id,new Set(activeDirs(r).map(d=>doorCell(r,d)))));return m}
function rebuildGraph(){graph.forEach(s=>s.clear());const dm=activeDoorMap();const cross=(a,b)=>{const ra=cellType.get(a),rb=cellType.get(b);if(ra===rb)return true;if(ra==='hall'&&rb==='hall')return true;if(ra==='hall'&&rb!=='hall')return dm.get(rb).has(b);if(rb==='hall'&&ra!=='hall')return dm.get(ra).has(a);return false};for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const a=key(x,y);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS){const b=key(nx,ny);if(cross(a,b))graph.get(a).add(b)}}}if(passages){link(key(4,3),key(25,19));link(key(25,3),key(4,19))}updateVision()}function link(a,b){graph.get(a).add(b);graph.get(b).add(a)}
function metrics(){const r=grid.getBoundingClientRect(),b=board.getBoundingClientRect();return{left:(r.left-b.left)*(board.offsetWidth/b.width),top:(r.top-b.top)*(board.offsetHeight/b.height),w:(r.width/COLS)*(board.offsetWidth/b.width),h:(r.height/ROWS)*(board.offsetHeight/b.height)}}function centerOf(k){const[x,y]=parse(k),m=metrics();return{x:m.left+(x+.5)*m.w,y:m.top+(y+.5)*m.h}}
function addRooms(){const m=metrics();roomDefs.forEach(r=>{const el=document.createElement('div');el.className='room'+(r.center?' center':'');el.style.left=m.left+r.x*m.w+'px';el.style.top=m.top+r.y*m.h+'px';el.style.width=r.w*m.w+'px';el.style.height=r.h*m.h+'px';el.innerHTML='<h3>'+r.name+'</h3>'+(r.center?'':r.physical.map(d=>'<i class="door '+d+'" data-dir="'+d+'"></i>').join(''));board.appendChild(el);roomEls.set(r.id,el)});[['vault','4,3'],['back','25,19'],['high','25,3'],['workshop','4,19']].forEach(([id,k])=>{const p=centerOf(k),e=document.createElement('i');e.className='passage';e.style.left=p.x+'px';e.style.top=p.y+'px';board.appendChild(e)});paintSystems();updateLabelRotation()}
function paintSystems(){roomDefs.forEach(r=>{if(r.center)return;const a=new Set(activeDirs(r));roomEls.get(r.id)?.querySelectorAll('.door').forEach(d=>{d.classList.toggle('open',a.has(d.dataset.dir));d.classList.toggle('closed',!a.has(d.dataset.dir))})});document.querySelectorAll('.passage').forEach(e=>e.classList.toggle('on',passages));route.textContent='DOORS: '+routing.toUpperCase();route.classList.toggle('on',routing==='main');document.getElementById('passages').textContent='PASSAGES: '+(passages?'ON':'OFF');west.classList.toggle('on',emergency==='west');east.classList.toggle('on',emergency==='east')}
const piece=document.createElement('div');piece.className='piece player-asset';piece.innerHTML='<div class="art"><img src="/Game-Pieces/THE%20FIRESTARTER.PNG" alt="Sam — The Firestarter game piece"></div><div class="base"></div><div class="name">SAM</div>';board.appendChild(piece);const probes=[{name:'NEAR',cell:key(16,11),icon:'●'},{name:'DIST 3',cell:key(15,8),icon:'3'},{name:'DIST 5',cell:key(15,6),icon:'5'},{name:'DIST 6',cell:key(15,5),icon:'6'},{name:'BEHIND WALL',cell:key(14,5),icon:'×'},{name:'OUTSIDE 6',cell:key(15,4),icon:'7'}];function addTestPieces(){for(const p of probes){const el=document.createElement('div');el.className='piece test';el.dataset.cell=p.cell;el.innerHTML='<div class="art">'+p.icon+'</div><div class="base"></div><div class="name">'+p.name+'</div>';board.appendChild(el);testPieces.push(el)}placeTestPieces();updateLabelRotation()}
function place(){const p=centerOf(current);piece.style.left=p.x+'px';piece.style.top=p.y+'px'}function placeTestPieces(){testPieces.forEach(el=>{const p=centerOf(el.dataset.cell);el.style.left=p.x+'px';el.style.top=p.y+'px'})}function bfsFrom(origin,max){const dist=new Map([[origin,0]]),prev=new Map(),q=[origin];for(let i=0;i<q.length;i++){const a=q[i],d=dist.get(a);if(d>=max)continue;for(const b of graph.get(a)){if(!dist.has(b)){dist.set(b,d+1);prev.set(b,a);q.push(b)}}}return{dist,prev}}function bfs(max){return bfsFrom(current,max)}
function canSeeLine(a,b){if(a===b)return true;const[ax,ay]=parse(a),[bx,by]=parse(b),ra=cellType.get(a),rb=cellType.get(b);if(ra===rb&&ra!=='hall')return true;const steps=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)*8));let px=ax,py=ay,pk=a;for(let i=1;i<=steps;i++){const t=i/steps,nx=Math.floor(ax+(bx-ax)*t+.5),ny=Math.floor(ay+(by-ay)*t+.5),nk=key(nx,ny);if(nk===pk)continue;const dx=Math.abs(nx-px),dy=Math.abs(ny-py);if(dx+dy===1){if(!graph.get(pk)?.has(nk))return false}else if(dx===1&&dy===1){const m1=key(nx,py),m2=key(px,ny);const way1=graph.get(pk)?.has(m1)&&graph.get(m1)?.has(nk);const way2=graph.get(pk)?.has(m2)&&graph.get(m2)?.has(nk);if(!(way1&&way2))return false}else{return false}px=nx;py=ny;pk=nk}return true}
function updateVision(){const{dist}=bfs(VISION);tiles.forEach((t,k)=>{for(let i=0;i<=6;i++)t.classList.remove('lit'+i);t.classList.remove('emergency','seen');const d=dist.get(k);if(d!==undefined&&canSeeLine(current,k))t.classList.add('seen','lit'+Math.min(6,d));if(isEmergency(k))t.classList.add('emergency')});testPieces.forEach(el=>{const k=el.dataset.cell,d=dist.get(k),visible=(d!==undefined&&d<=VISION&&canSeeLine(current,k))||isEmergency(k);el.classList.toggle('visible',visible)});paintMovement()}function isEmergency(k){if(!emergency)return false;const[x,y]=parse(k);return emergency==='west'?(x===8||x===9)&&y>=6&&y<=16:(x===20||x===21)&&y>=6&&y<=16}
function pathTo(target,prev){const p=[target];while(p[0]!==current){const n=prev.get(p[0]);if(!n)return[];p.unshift(n)}return p}function paintMovement(){tiles.forEach(t=>t.classList.remove('reachable','path','current'));tiles.get(current)?.classList.add('current');for(const k of reachable.keys())if(k!==current)tiles.get(k)?.classList.add('reachable')}function doRoll(){if(moving)return;budget=1+Math.floor(Math.random()*6);const{dist,prev}=bfs(budget);reachable=new Map([...dist].map(([k,d])=>[k,{d,prev}]));die.textContent='ROLL '+budget;status.textContent='Tap one purple destination.';paintMovement()}
async function moveTo(target){if(moving||!reachable.has(target)||target===current)return;const path=pathTo(target,reachable.get(target).prev);if(path.length<2)return;moving=true;tiles.forEach(t=>t.classList.remove('path'));path.slice(1).forEach(k=>tiles.get(k)?.classList.add('path'));for(const step of path.slice(1)){current=step;place();updateVision();await new Promise(r=>setTimeout(r,150))}budget=0;reachable.clear();updateVision();die.textContent='ROLL —';status.textContent='Movement complete.';moving=false}tiles.forEach((t,k)=>t.onclick=e=>{e.stopPropagation();moveTo(k)});document.getElementById('roll').onclick=doRoll;
route.onclick=()=>{if(moving)return;routing=routing==='main'?'side':'main';reachable.clear();rebuildGraph();paintSystems()};document.getElementById('passages').onclick=()=>{if(moving)return;passages=!passages;reachable.clear();rebuildGraph();paintSystems()};west.onclick=()=>{emergency='west';updateVision();paintSystems()};east.onclick=()=>{emergency='east';updateVision();paintSystems()};lightsOff.onclick=()=>{emergency=null;updateVision();paintSystems()};
function updateLabelRotation(){const counter=-rotation;document.querySelectorAll('.room h3,.piece .name').forEach(el=>el.style.transform='rotate('+counter+'deg)')}function boardTransform(){board.style.transform='rotateX(38deg) rotateZ('+(rotation-1.3)+'deg)'}function rotate(d){rotation=(rotation+d+360)%360;boardTransform();updateLabelRotation();compass.style.transform='rotate('+(-rotation)+'deg)'}rotL.onclick=()=>rotate(-90);rotR.onclick=()=>rotate(90);
const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-710,panY=-550,drag=false,dragMoved=false,activePointer=null,startX=0,startY=0,startPanX=0,startPanY=0;function apply(){world.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+scale+')'}function resetView(){scale=innerWidth<720?.48:.68;panX=-world.offsetWidth/2;panY=-world.offsetHeight/2+15;rotation=0;boardTransform();updateLabelRotation();compass.style.transform='rotate(0deg)';apply()}zoomIn.onclick=()=>{scale=Math.min(1.55,scale+.1);apply()};zoomOut.onclick=()=>{scale=Math.max(.42,scale-.1);apply()};reset.onclick=resetView;stage.onpointerdown=e=>{if(activePointer!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();activePointer=e.pointerId;drag=true;dragMoved=false;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}};stage.onpointermove=e=>{if(!drag||e.pointerId!==activePointer)return;e.preventDefault();const dx=e.clientX-startX,dy=e.clientY-startY;if(!dragMoved&&Math.hypot(dx,dy)>4)dragMoved=true;panX=startPanX+dx;panY=startPanY+dy;apply()};const endDrag=e=>{if(!drag||e.pointerId!==activePointer)return;e.preventDefault();drag=false;stage.classList.remove('dragging');try{if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId)}catch(_){}activePointer=null;setTimeout(()=>{dragMoved=false},0)};stage.onpointerup=endDrag;stage.onpointercancel=endDrag;stage.onlostpointercapture=e=>{if(e.pointerId===activePointer){drag=false;activePointer=null;stage.classList.remove('dragging')}};stage.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopImmediatePropagation()}},true);stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.42,Math.min(1.55,scale+(e.deltaY<0?.08:-.08)));apply()},{passive:false});
rebuildGraph();requestAnimationFrame(()=>{addRooms();addTestPieces();place();boardTransform();updateVision();resetView()});let resizeTimer=0;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(drag)return;place();placeTestPieces();},180)});
</script></body></html>
