<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KILLER AMONG US — Assembly V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;color:#f4dfb0;font-family:Arial,sans-serif}body{position:fixed;inset:0}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 44%,#261014 0,#080606 52%,#010101 100%)}
#board{position:absolute;width:4756px;height:4428px;transform-origin:50% 50%;transform-style:preserve-3d;will-change:left,top,transform}
.floorBase,.floorZone{position:absolute;pointer-events:none}.floorBase{inset:0;z-index:1;background-image:linear-gradient(#0005,#0005),url('/assets/board-ui/floor-tiles/seamless_luxury_black_marble_texture.PNG');background-size:820px 820px}.floorZone{z-index:2;background-size:700px 700px;background-repeat:repeat;box-shadow:inset 0 0 90px #0009}
.cell{position:absolute;width:164px;height:164px;z-index:5;border:1px solid #d8b7652d;background:transparent}.cell.room{border-color:#d3a64d22}.cell.casino{border-color:#f1c26a44}.cell.perim{border:4px solid #5ad0dc65;box-shadow:inset 0 0 30px #1e6f7828}
.roomframe{position:absolute;border:8px solid #b88a3e8f;pointer-events:none;z-index:7;box-shadow:0 0 0 2px #0008,inset 0 0 30px #0008}
.prop{position:absolute;pointer-events:none;aspect-ratio:1/1;transform-origin:50% 92%;filter:drop-shadow(0 24px 17px #000a);will-change:transform}.prop img{display:block;width:100%;height:100%;object-fit:contain}.prop.hero{filter:drop-shadow(0 30px 22px #000c)}.prop.flat{filter:drop-shadow(0 9px 10px #0008)}
.label{position:absolute;z-index:9000;transform-origin:center;background:#070504d6;border:3px solid #bd8d3c;border-radius:10px;padding:9px 14px;color:#f1d9a4;font:900 17px Georgia;white-space:nowrap;letter-spacing:.06em;pointer-events:none;display:none}
.coord{position:absolute;z-index:9999;transform-origin:center;font:900 18px monospace;background:#000d;color:#fff;border:2px solid #d6a64c;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
.marker{position:absolute;z-index:9500;transform-origin:center;width:112.75px;height:112.75px;border-radius:50%;background:#090909;border:8px solid #e0ae50;box-shadow:0 14px 16px #000,0 0 0 4px #120c08;pointer-events:none}.marker:after{content:"";position:absolute;left:50%;top:-68px;transform:translateX(-50%);width:54px;height:74px;border-radius:50% 50% 36% 36%;background:#111;border:8px solid inherit}.marker.selected{box-shadow:0 0 0 12px #fff8,0 14px 16px #000}
.hud{position:fixed;left:10px;right:10px;top:max(9px,env(safe-area-inset-top));z-index:12000;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#080606ed;border:1px solid #8f6a31;border-radius:10px;padding:8px 10px;box-shadow:0 7px 20px #000;pointer-events:auto}.brand small{display:block;font-size:8px;color:#65d9e4;letter-spacing:.16em}.brand b{font:900 17px Georgia}.brand span{color:#c52d3b}.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}button{background:#160e0b;color:#f2d8a1;border:1px solid #8e692f;border-radius:7px;font-weight:900;min-height:36px;padding:0 8px}.status{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:12000;max-width:390px;font-size:10px;line-height:1.35}.legend{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:12000;font-size:9px;max-width:220px}.ok{color:#75df8b}.gold{color:#e3b458}.warn{color:#ffca64}
@media(max-width:520px){.legend{max-width:145px}.status{max-width:58%}.brand b{font-size:15px}.tools{max-width:285px}button{padding:0 6px;font-size:11px}}
</style>
</head>
<body>
<div id="stage"><div id="board"></div></div>
<div class="hud"><div class="panel brand"><small>ASSEMBLY V2 · ROOM COMPOSITION</small><b>KILLER <span>AMONG US</span></b></div><div class="panel tools"><button id="rotL">↶90°</button><button id="rotR">↷90°</button><button id="minus">−</button><button id="plus">＋</button><button id="playBtn">PLAY</button><button id="fitBtn">FIT</button><button id="gridBtn">GRID</button><button id="assetBtn">ASSETS</button><button id="labelBtn">LABELS</button></div></div>
<div class="panel status" id="statusBox"><b>ROOM COMPOSITION PASS</b><br>Real uploaded PNGs arranged as nine distinct furnished rooms. No walls or lighting pass yet.</div>
<div class="panel legend"><b>ASSEMBLY V2</b><br><span class="ok">✓</span> exact 29×27<br><span class="ok">✓</span> 45 real PNGs<br><span class="ok">✓</span> room-by-room layouts<br><span class="ok">✓</span> open circulation<br><span class="gold">PLAY</span> giant-board view<br><span class="warn">NEXT</span> walls + doors</div>
<script>
const C=29,R=27,T=164,W=C*T,H=R*T,PHI=57,GAME_ZOOM=6,ROOT='/assets/board-ui/rooms/';
const board=document.getElementById('board'),stage=document.getElementById('stage'),statusBox=document.getElementById('statusBox');
const rooms=[
['VAULT',2,2,6,5,'seamless_gray_marble_stone_texture.PNG'],
['CONTROL ROOM',13,2,6,5,'seamless_charcoal_marble_stone_texture.PNG'],
['HIGH ROLLER ROOM',24,2,5,5,'dark_espresso_parquet_texture.PNG'],
['BACK OFFICE',2,12,6,5,'burgundy_damask_velvet_texture.PNG'],
['CASINO FLOOR',13,12,6,5,'burgundy_and_gold_ornamental_lattice.PNG'],
['AFTERHOURS',24,12,5,5,'art_deco_plum_and_gold_marble_tile.PNG'],
['WORKSHOP',2,22,6,5,'seamless_charcoal_marble_stone_texture.PNG'],
['KITCHEN',13,22,6,5,'seamless_gray_marble_stone_texture.PNG'],
['BACK ROOM',24,22,5,5,'seamless_luxury_black_marble_texture.PNG']
];
const props=[
// VAULT — storage on rear edge, security near entry, valuable display forward
['vault','vault_safe_deposit_wall.PNG',3.15,2.80,355],
['vault','vault_main_door.PNG',6.70,3.05,315],
['vault','vault_security_station.PNG',5.80,3.75,270],
['vault','vault_secure_display_table.PNG',4.15,4.95,360,'hero'],
['vault','vault_lockbox_trolley.PNG',6.20,5.35,205],
// CONTROL ROOM — screens/servers on rear, command console as center anchor
['control-room','control_server_cluster.PNG',13.65,2.95,240],
['control-room','control_surveillance_wall.PNG',15.55,2.75,400],
['control-room','control_operator_workstation.PNG',17.45,3.55,285],
['control-room','control_main_command_console.PNG',15.45,4.55,385,'hero'],
['control-room','control_tactical_table.PNG',17.10,5.45,285],
// HIGH ROLLER — private booth at rear, poker table center, service pieces around perimeter
['high-roller','high_roller_private_booth.PNG',24.85,2.95,325],
['high-roller','high_roller_card_sideboard.PNG',27.45,2.90,235],
['high-roller','high_roller_chip_display_cabinet.PNG',27.55,4.15,230],
['high-roller','high_roller_poker_table.PNG',26.00,4.85,455,'hero'],
['high-roller','high_roller_whiskey_trolley.PNG',24.55,5.50,190],
// BACK OFFICE — evidence/archive rear wall, desk center, seating forward
['back-office','back_office_evidence_board.PNG',2.95,12.85,290],
['back-office','back_office_archival_cabinet.PNG',6.45,12.90,285],
['back-office','back_office_executive_desk.PNG',4.55,14.25,390,'hero'],
['back-office','back_office_credenza.PNG',6.45,14.70,245],
['back-office','back_office_lounge_seating.PNG',3.00,15.55,320],
// CASINO FLOOR — medallion anchors room, gaming left/right, service at rear
['casino-floor','casino_center_medallion.PNG',15.50,14.15,380,'flat'],
['casino-floor','casino_slot_bank.PNG',13.65,12.90,280],
['casino-floor','casino_bar_counter.PNG',17.30,12.95,335],
['casino-floor','casino_poker_table.PNG',14.15,15.20,345,'hero'],
['casino-floor','casino_roulette_table.PNG',16.95,15.15,340,'hero'],
// AFTERHOURS — bar/DJ rear, booth and lounge groups across front half
['afterhours','art_deco_amethyst_cocktail_bar.PNG',25.20,12.90,320],
['afterhours','art_deco_purple_gold_dj_booth.PNG',27.35,12.95,315],
['afterhours','art_deco_nightclub_booth_nook.PNG',24.60,14.45,295],
['afterhours','art_deco_purple_lounge_set.PNG',26.15,15.35,340,'hero'],
['afterhours','art_deco_purple_lounge_set_b.PNG',27.70,15.20,265],
// WORKSHOP — tool storage rear, working equipment around an open work lane
['workshop','workshop_tool_wall.PNG',3.05,22.85,320],
['workshop','workshop_parts_shelving.PNG',6.45,22.90,300],
['workshop','workshop_main_workbench.PNG',4.35,24.35,405,'hero'],
['workshop','workshop_fabrication_station.PNG',6.30,24.65,320],
['workshop','workshop_rolling_tool_cart.PNG',2.75,25.55,215],
// KITCHEN — cabinetry rear, island center, dining forward
['kitchen','luxurious_isometric_walnut_kitchen_unit.PNG',13.80,22.90,315],
['kitchen','luxury_isometric_chef_kitchen.PNG',17.10,22.95,350],
['kitchen','luxury_isometric_kitchen_island.PNG',15.50,24.35,405,'hero'],
['kitchen','luxury_isometric_coffee_bar_sideboard.PNG',17.35,24.75,255],
['kitchen','luxury_isometric_dining_nook.PNG',14.00,25.55,320],
// BACK ROOM — storage around perimeter, service table center, crates forward
['back-room','back_room_storage_shelving.PNG',24.70,22.90,305],
['back-room','back_room_old_lockers.PNG',27.45,22.95,310],
['back-room','back_room_service_worktable.PNG',26.00,24.50,375,'hero'],
['back-room','back_room_utility_cabinet.PNG',27.55,24.85,235],
['back-room','back_room_crate_stack.PNG',24.60,25.55,245]
];
const rc=new Map;
rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});
const base=document.createElement('div');base.className='floorBase';board.appendChild(base);
rooms.forEach(([n,x,y,w,h,tex])=>{const z=document.createElement('div');z.className='floorZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';z.style.backgroundImage=`linear-gradient(#0002,#0002),url('/assets/board-ui/floor-tiles/${tex}')`;board.appendChild(z)});
const center=(x,y)=>[(x-.5)*T,(y-.5)*T];
for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){const e=document.createElement('i'),n=rc.get(x+','+y),per=x===1||x===C||y===1||y===R;e.className='cell '+(per?'perim ':'')+(n?'room ':'')+(n==='CASINO FLOOR'?'casino ':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';e.dataset.x=x;e.dataset.y=y;board.appendChild(e)}
rooms.forEach(([n,x,y,w,h])=>{const f=document.createElement('i');f.className='roomframe';f.style.left=(x-1)*T+'px';f.style.top=(y-1)*T+'px';f.style.width=w*T+'px';f.style.height=h*T+'px';board.appendChild(f)});
const propEls=[];
props.forEach(([folder,file,x,y,width,kind])=>{const[cx,cy]=center(x,y),p=document.createElement('div');p.className='prop'+(kind?' '+kind:'');p.dataset.x=x;p.dataset.y=y;p.dataset.file=file;p.style.left=cx+'px';p.style.top=cy+'px';p.style.width=width+'px';const img=document.createElement('img');img.alt='';img.draggable=false;img.loading='lazy';img.src=ROOT+folder+'/'+file;p.appendChild(img);board.appendChild(p);propEls.push(p)});
rooms.forEach(([n,x,y,w,h])=>{const l=document.createElement('div');l.className='label uprightUI';l.textContent=n;l.style.left=(x-1+w/2)*T+'px';l.style.top=(y-.30)*T+'px';board.appendChild(l)});
function mkPiece(x,y,selected=false){const p=document.createElement('div');p.className='marker uprightUI'+(selected?' selected':'');p.dataset.x=x;p.dataset.y=y;const[cx,cy]=center(x,y);p.style.left=cx+'px';p.style.top=cy+'px';board.appendChild(p);return p}
const selected=mkPiece(15,15,true),coord=document.createElement('div');coord.className='coord uprightUI';board.appendChild(coord);
let turn=0,zoom=GAME_ZOOM,fit=1,panX=0,panY=0,drag=false,moved=false,startX=0,startY=0,startPanX=0,startPanY=0,gridOn=true,assetsOn=true,labelsOn=false;
function projectedSize(angleDeg){const a=angleDeg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),cp=Math.cos(PHI*Math.PI/180),pts=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([x,y])=>[c*x-s*y,(s*x+c*y)*cp]);return[Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))-Math.min(...pts.map(p=>p[1]))]}
function calcFit(){const[pw,ph]=projectedSize(-45+turn),availW=Math.max(200,innerWidth-24),availH=Math.max(220,innerHeight-355);fit=Math.min(availW/pw,availH/ph,.72)}
function updateSprites(){const angle=-45+turn,a=angle*Math.PI/180;document.querySelectorAll('.uprightUI').forEach(e=>e.style.transform=`translate(-50%,-50%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`);propEls.forEach(p=>{const x=(+p.dataset.x-.5)*T,y=(+p.dataset.y-.5)*T,dx=x-W/2,dy=y-H/2,depth=Math.sin(a)*dx+Math.cos(a)*dy;p.style.zIndex=5000+Math.round(depth);p.style.transform=`translate(-50%,-92%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`})}
function draw(){const s=fit*zoom;board.style.left=(innerWidth/2-W/2+panX)+'px';const usableCenterY=170+(innerHeight-355)/2;board.style.top=(usableCenterY-H/2+panY)+'px';board.style.transform=`scale(${s}) rotateX(${PHI}deg) rotateZ(${-45+turn}deg)`;updateSprites()}
function setMode(z,label){zoom=z;panX=panY=0;calcFit();draw();statusBox.innerHTML=`<b>${label}</b><br>${label==='PLAY VIEW'?'Accepted giant-board scale. Pan through the furnished rooms.':'Whole 29×27 furnished HQ.'}`}
function placeSelected(x,y){const n=rc.get(x+','+y),[cx,cy]=center(x,y);selected.style.left=cx+'px';selected.style.top=cy+'px';coord.style.left=cx+'px';coord.style.top=(cy+90)+'px';coord.textContent=`${x},${y}`;statusBox.innerHTML=`<b>TILE ${x},${y}</b><br>${n||(x===1||x===29||y===1||y===27?'ONE-TILE PERIMETER':'CORRIDOR')}`;updateSprites()}
rotL.onclick=()=>{turn=(turn+270)%360;calcFit();draw()};rotR.onclick=()=>{turn=(turn+90)%360;calcFit();draw()};plus.onclick=()=>{zoom=Math.min(10,zoom*1.18);draw()};minus.onclick=()=>{zoom=Math.max(.45,zoom/1.18);draw()};playBtn.onclick=()=>setMode(GAME_ZOOM,'PLAY VIEW');fitBtn.onclick=()=>setMode(1,'FIT VIEW');
gridBtn.onclick=()=>{gridOn=!gridOn;document.querySelectorAll('.cell').forEach(e=>e.style.borderColor=gridOn?'':'transparent');statusBox.innerHTML=`<b>GRID ${gridOn?'ON':'OFF'}</b><br>Furniture anchors and room geometry do not change.`};
assetBtn.onclick=()=>{assetsOn=!assetsOn;propEls.forEach(e=>e.style.display=assetsOn?'':'none');statusBox.innerHTML=`<b>ASSETS ${assetsOn?'ON':'OFF'}</b><br>${assetsOn?'Showing the real furnished room compositions.':'Showing floor geometry only.'}`};
labelBtn.onclick=()=>{labelsOn=!labelsOn;document.querySelectorAll('.label').forEach(e=>e.style.display=labelsOn?'block':'none');statusBox.innerHTML=`<b>LABELS ${labelsOn?'ON':'OFF'}</b>`;updateSprites()};
stage.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>6)moved=true;if(moved){panX=startPanX+dx;panY=startPanY+dy;draw()}});
stage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.classList.contains('cell'))placeSelected(+el.dataset.x,+el.dataset.y)}});stage.addEventListener('pointercancel',()=>drag=false);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',()=>{calcFit();draw()});
calcFit();placeSelected(15,15);draw();
</script>
</body>
</html>
