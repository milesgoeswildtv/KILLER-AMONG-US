<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KILLER AMONG US — Control Room Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020405;color:#dcf7fb;font-family:Arial,sans-serif}body{position:fixed;inset:0}.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle,#09202a 0,#04090c 50%,#010203 100%)}.top,.bottom{z-index:20;padding:8px;display:flex;gap:6px;flex-wrap:wrap}.top{padding-top:max(8px,env(safe-area-inset-top))}.bottom{padding-bottom:max(10px,env(safe-area-inset-bottom));align-items:center}.panel{background:#061014ee;border:1px solid #467f8c;border-radius:9px;box-shadow:0 8px 20px #000}.brand{padding:8px 10px;flex:1;min-width:180px}.brand small{display:block;font-size:8px;letter-spacing:.17em;color:#6ddbea;font-weight:800}.brand b{font:900 17px Georgia;color:#f3d78d}.tools,.assetTools{padding:5px;display:flex;gap:5px;flex-wrap:wrap}button{min-height:34px;border:1px solid #467f8c;border-radius:6px;background:#0b171b;color:#d9f9fd;font-weight:900;padding:0 8px}button.active{outline:2px solid #68dfee}.stage{position:relative;min-height:0;overflow:hidden;touch-action:none}.room{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);transform-origin:center}.floor{position:absolute;overflow:visible;filter:drop-shadow(0 25px 32px #000)}.wrap{position:absolute;width:0;height:0;touch-action:none}.prop{position:absolute;max-width:none;-webkit-user-drag:none;user-select:none;touch-action:none;filter:drop-shadow(0 12px 10px #000b)}.prop.sel{filter:drop-shadow(0 0 10px #63e5f7) drop-shadow(0 12px 10px #000b)}.bbox{position:absolute;border:1px dashed #66dfef;pointer-events:none;display:none}.showBounds .bbox{display:block}.ring{position:absolute;width:22px;height:22px;border:3px solid #63e5f7;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;background:#041014aa}.hit{position:absolute;width:58px;height:36px;transform:translate(-50%,-50%);display:none;z-index:700}.walk .hit{display:block}.piece{position:absolute;width:126px;height:63px;transform:translate(-50%,-50%);border:4px solid #69ddec;border-radius:50%;background:#69ddec35;box-shadow:0 0 18px #69ddecaa;display:none;z-index:850;pointer-events:none}.walk .piece{display:block}.readout{padding:8px 10px;flex:1;min-width:220px;font-size:11px;line-height:1.4}.cyan{color:#70e4f3}.gold{color:#f0d281}.green{color:#79e99c}@media(max-width:760px){button{font-size:9px;padding:0 5px}.brand{min-width:130px}.bottom{display:grid}.assetTools{display:grid;grid-template-columns:repeat(7,1fr)}}
</style></head><body><div class="app"><div class="top"><div class="panel brand"><small>ROOM LAYOUT LAB · CONTROL ROOM · 6×5</small><b>KILLER AMONG US</b></div><div class="panel tools"><button id="vault">← VAULT</button><button id="fit">FIT</button><button id="grid" class="active">GRID</button><button id="centers" class="active">CENTERS</button><button id="bounds">BOUNDS</button><button id="walk">WALK TEST</button><button id="copy">COPY LAYOUT</button><button id="reset">RESET</button></div></div><div class="stage" id="stage"><div class="room" id="room"><svg class="floor" id="floor"></svg><div class="ring" id="ring"></div><div class="piece" id="piece"></div></div></div><div class="bottom"><div class="panel readout" id="readout"><b>CONTROL ROOM</b><br><span class="cyan">Loading the real room assets…</span></div><div class="panel assetTools"><button id="prev">◀ PROP</button><button id="next">PROP ▶</button><button id="small">SIZE −</button><button id="big">SIZE +</button><button id="mirror">MIRROR</button><button id="back">SEND BACK</button><button id="front">BRING FRONT</button></div></div></div><script>
const RW=6,RH=5,TW=184,TH=92,ROOT='/assets/board-ui/rooms/control-room/',FLOOR='/assets/board-ui/floor-tiles/seamless_charcoal_marble_stone_texture.PNG',KEY='kau_control_room_lab_v2';
const DEF=[{id:'surv',file:'control_surveillance_wall.PNG',label:'Surveillance Wall',x:3,y:.65,vw:2.2,flip:false,bias:-45},{id:'server',file:'control_server_cluster.PNG',label:'Server Cluster',x:1,y:2.0,vw:1.35,flip:false,bias:-20},{id:'console',file:'control_main_command_console.PNG',label:'Main Command Console',x:3.2,y:2.25,vw:1.65,flip:false,bias:10},{id:'operator',file:'control_operator_workstation.PNG',label:'Operator Workstation',x:4.7,y:3.75,vw:1.35,flip:true,bias:25},{id:'tactical',file:'control_tactical_table.PNG',label:'Tactical Table',x:2.15,y:3.8,vw:1.25,flip:false,bias:30}];
const clone=v=>JSON.parse(JSON.stringify(v));let A=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length===DEF.length)return x.map((v,i)=>({...DEF[i],...v}))}catch(e){}return clone(DEF)})();const M={};let sel=2,drag=null,sc=1,g=true,c=true,b=false,w=false,test={x:5.5,y:2.5};const room=document.getElementById('room'),stage=document.getElementById('stage'),floor=document.getElementById('floor'),ring=document.getElementById('ring'),piece=document.getElementById('piece'),readout=document.getElementById('readout');
const P=(x,y)=>({x:(x-y)*TW/2,y:(x+y)*TH/2});const B=()=>{let p=[P(0,0),P(RW,0),P(RW,RH),P(0,RH)];return{minX:Math.min(...p.map(v=>v.x)),maxX:Math.max(...p.map(v=>v.x)),minY:Math.min(...p.map(v=>v.y)),maxY:Math.max(...p.map(v=>v.y))}};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
function measure(a){return new Promise(done=>{let im=new Image();im.onload=()=>{try{let s=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight)),cw=Math.max(1,Math.round(im.naturalWidth*s)),ch=Math.max(1,Math.round(im.naturalHeight*s)),cv=document.createElement('canvas');cv.width=cw;cv.height=ch;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,cw,ch);let d=x.getImageData(0,0,cw,ch).data,l=cw,t=ch,r=-1,bb=-1;for(let y=0;y<ch;y++)for(let z=0;z<cw;z++)if(d[(y*cw+z)*4+3]>16){l=Math.min(l,z);r=Math.max(r,z);t=Math.min(t,y);bb=Math.max(bb,y)}if(r<l){l=0;t=0;r=cw-1;bb=ch-1}M[a.id]={nw:im.naturalWidth,nh:im.naturalHeight,l:l/s,t:t/s,r:(r+1)/s,bb:(bb+1)/s,rw:(r+1-l)/cw};}catch(e){M[a.id]={nw:im.naturalWidth,nh:im.naturalHeight,l:0,t:0,r:im.naturalWidth,bb:im.naturalHeight,rw:1}}done()};im.onerror=()=>{M[a.id]={nw:1,nh:1,l:0,t:0,r:1,bb:1,rw:1};done()};im.src=ROOT+a.file})}
function drawFloor(){let q=B(),W=q.maxX-q.minX,H=q.maxY-q.minY;floor.setAttribute('width',W);floor.setAttribute('height',H);floor.setAttribute('viewBox',`0 0 ${W} ${H}`);floor.style.left=q.minX+'px';floor.style.top=q.minY+'px';let pt=(x,y)=>{let p=P(x,y);return`${p.x-q.minX},${p.y-q.minY}`},s=`<defs><pattern id="m" patternUnits="userSpaceOnUse" width="420" height="420"><image href="${FLOOR}" width="420" height="420" opacity=".78"/></pattern></defs><polygon points="${pt(0,0)} ${pt(RW,0)} ${pt(RW,RH)} ${pt(0,RH)}" fill="url(#m)" stroke="#58c7d8" stroke-width="5"/>`;if(g){for(let x=0;x<=RW;x++){let a=P(x,0),z=P(x,RH);s+=`<line x1="${a.x-q.minX}" y1="${a.y-q.minY}" x2="${z.x-q.minX}" y2="${z.y-q.minY}" stroke="#6ed8e653"/>`}for(let y=0;y<=RH;y++){let a=P(0,y),z=P(RW,y);s+=`<line x1="${a.x-q.minX}" y1="${a.y-q.minY}" x2="${z.x-q.minX}" y2="${z.y-q.minY}" stroke="#6ed8e653"/>`}}if(c)for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){let a=P(x+.5,y+.5);s+=`<circle cx="${a.x-q.minX}" cy="${a.y-q.minY}" r="4" fill="#6ee7f5"/>`}let marks=[['W',P(0,1.9),P(0,3.1),-30,0],['E',P(RW,1.9),P(RW,3.1),18,0],['S',P(2.35,RH),P(3.65,RH),0,24]];for(let [n,a,z,dx,dy] of marks)s+=`<line x1="${a.x-q.minX}" y1="${a.y-q.minY}" x2="${z.x-q.minX}" y2="${z.y-q.minY}" stroke="#66e6f7" stroke-width="8"/><text x="${(a.x+z.x)/2-q.minX+dx}" y="${(a.y+z.y)/2-q.minY+dy}" fill="#a7f5ff" font-size="18" font-weight="900">${n}</text>`;floor.innerHTML=s}
function hits(){if(document.querySelectorAll('.hit').length)return;for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){let h=document.createElement('div'),p=P(x+.5,y+.5);h.className='hit';h.style.left=p.x+'px';h.style.top=p.y+'px';h.onclick=e=>{if(!w)return;e.stopPropagation();test={x:x+.5,y:y+.5};renderPiece()};room.appendChild(h)}}function fit(){let r=stage.getBoundingClientRect(),q=B(),W=q.maxX-q.minX,H=q.maxY-q.minY;sc=Math.min((r.width-32)/(W+310),(r.height-32)/(H+330),1.18);room.style.transform=`translate(-50%,-50%) scale(${sc})`}
function prop(a,i){let wr=document.getElementById('w'+i),im,box;if(!wr){wr=document.createElement('div');wr.className='wrap';wr.id='w'+i;im=document.createElement('img');im.className='prop';im.draggable=false;im.src=ROOT+a.file;im.dataset.i=i;im.onpointerdown=down;box=document.createElement('div');box.className='bbox';wr.append(im,box);room.appendChild(wr)}else{im=wr.firstChild;box=wr.lastChild}let p=P(a.x,a.y),m=M[a.id]||{nw:1,l:0,t:0,r:1,bb:1,rw:1},vis=(a.vw||1)*TW,full=vis/Math.max(.05,m.rw),px=full/m.nw,center=(m.l+m.r)/2*px,bottom=m.bb*px;wr.style.left=p.x+'px';wr.style.top=p.y+'px';wr.style.transform=`scaleX(${a.flip?-1:1})`;wr.style.zIndex=1000+Math.round((a.x+a.y)*40)+(a.bias||0);im.style.width=full+'px';im.style.left=-center+'px';im.style.top=-bottom+'px';im.classList.toggle('sel',i===sel);box.style.left=(m.l*px-center)+'px';box.style.top=(m.t*px-bottom)+'px';box.style.width=(m.r-m.l)*px+'px';box.style.height=(m.bb-m.t)*px+'px'}function renderPiece(){let p=P(test.x,test.y);piece.style.left=p.x+'px';piece.style.top=p.y+'px'}
function render(){drawFloor();A.forEach(prop);hits();room.classList.toggle('showBounds',b);room.classList.toggle('walk',w);renderPiece();fit();let a=A[sel],p=P(a.x,a.y),m=M[a.id];ring.style.left=p.x+'px';ring.style.top=p.y+'px';readout.innerHTML=`<b>CONTROL ROOM — ${a.label}</b><br><span class="cyan">Anchor:</span> ${a.x.toFixed(2)}, ${a.y.toFixed(2)} tiles · <span class="gold">Visible width:</span> ${a.vw.toFixed(2)} tiles<br><span class="green">✓ autosaved</span> · ${m?Math.round(m.rw*100)+'% of PNG width is visible':'measuring…'}<br>Drag it. Size it. Mirror if needed. W/E/S are the actual entry sides.`;save()}
function down(e){e.preventDefault();sel=+e.currentTarget.dataset.i;let a=A[sel];drag={sx:e.clientX,sy:e.clientY,x:a.x,y:a.y};e.currentTarget.setPointerCapture?.(e.pointerId);render()}window.onpointermove=e=>{if(!drag)return;let a=A[sel],dx=(e.clientX-drag.sx)/sc,dy=(e.clientY-drag.sy)/sc;a.x=Math.max(.15,Math.min(RW-.15,drag.x+dx/TW+dy/TH));a.y=Math.max(.15,Math.min(RH-.15,drag.y+dy/TH-dx/TW));render()};window.onpointerup=()=>drag=null;
const id=x=>document.getElementById(x);id('prev').onclick=()=>{sel=(sel+A.length-1)%A.length;render()};id('next').onclick=()=>{sel=(sel+1)%A.length;render()};id('small').onclick=()=>{A[sel].vw=Math.max(.35,A[sel].vw-.06);render()};id('big').onclick=()=>{A[sel].vw=Math.min(2.9,A[sel].vw+.06);render()};id('mirror').onclick=()=>{A[sel].flip=!A[sel].flip;render()};id('back').onclick=()=>{A[sel].bias-=60;render()};id('front').onclick=()=>{A[sel].bias+=60;render()};id('fit').onclick=fit;id('grid').onclick=e=>{g=!g;e.currentTarget.classList.toggle('active',g);render()};id('centers').onclick=e=>{c=!c;e.currentTarget.classList.toggle('active',c);render()};id('bounds').onclick=e=>{b=!b;e.currentTarget.classList.toggle('active',b);render()};id('walk').onclick=e=>{w=!w;e.currentTarget.classList.toggle('active',w);render()};id('vault').onclick=()=>location.href='/board-room-layout-lab.html';id('reset').onclick=()=>{if(confirm('Reset Control Room?')){A=clone(DEF);sel=2;render()}};id('copy').onclick=()=>{let o={room:'control-room',footprint:{w:RW,h:RH},measurement:'alpha-visible-v1',assets:A.map(a=>({id:a.id,file:a.file,label:a.label,x:+a.x.toFixed(3),y:+a.y.toFixed(3),visibleWidthTiles:+a.vw.toFixed(3),mirror:!!a.flip,depthBias:a.bias||0}))},t=JSON.stringify(o,null,2);navigator.clipboard?.writeText(t).then(()=>readout.innerHTML='<b>CONTROL ROOM LAYOUT COPIED</b><br>Paste it into chat when you want me to lock it.').catch(()=>prompt('Copy:',t))};window.onresize=render;render();Promise.all(A.map(measure)).then(render);
</script></body></html>
