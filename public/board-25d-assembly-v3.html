tL">↶90°</button><button id="rotR">↷90°</button><button id="minus">−</button><button id="plus">＋</button><button id="playBtn">PLAY</button><button id="fitBtn">FIT</button><button id="gridBtn">GRID</button><button id="assetBtn">ASSETS</button><button id="labelBtn">LABELS</button></div></div><div class="panel status" id="statusBox"><b>FURNISHING PASS V3</b><br>Actual uploaded assets enlarged and composed as rooms. No walls or lighting yet.</div><div class="panel legend"><b>ASSEMBLY V3</b><br><span class="ok">✓</span> exact 29×27<br><span class="ok">✓</span> 45 real PNGs<br><span class="ok">✓</span> stronger room scale<br><span class="ok">✓</span> edge furniture + lanes<br><span class="gold">PLAY</span> giant-board view<br><span class="warn">NEXT</span> walls + doors</div><script>const C=29,R=27,T=164,W=C*T,H=R*T,PHI=57,GAME_ZOOM=6,ROOT='/assets/board-ui/rooms/';const board=document.getElementById('board'),stage=document.getElementById('stage'),statusBox=document.getElementById('statusBox');const rooms=[['VAULT',2,2,6,5,'seamless_gray_marble_stone_texture.PNG'],['CONTROL ROOM',13,2,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['HIGH ROLLER ROOM',24,2,5,5,'dark_espresso_parquet_texture.PNG'],['BACK OFFICE',2,12,6,5,'burgundy_damask_velvet_texture.PNG'],['CASINO FLOOR',13,12,6,5,'burgundy_and_gold_ornamental_lattice.PNG'],['AFTERHOURS',24,12,5,5,'art_deco_plum_and_gold_marble_tile.PNG'],['WORKSHOP',2,22,6,5,'seamless_charcoal_marble_stone_texture.PNG'],['KITCHEN',13,22,6,5,'seamless_gray_marble_stone_texture.PNG'],['BACK ROOM',24,22,5,5,'seamless_luxury_black_marble_texture.PNG']];const props=[['vault','vault_safe_deposit_wall.PNG',4.25,2.95,560,'wall'],['vault','vault_main_door.PNG',6.55,3.85,420,'wall'],['vault','vault_secure_display_table.PNG',4.35,4.30,430,'hero'],['vault','vault_security_station.PNG',2.85,5.20,330],['vault','vault_lockbox_trolley.PNG',6.15,5.25,255],['control-room','control_surveillance_wall.PNG',15.75,2.95,620,'wall'],['control-room','control_ etric_chef_kitchen.PNG',17.15,23.05,500,'wall'],['kitchen','luxury_isometric_kitchen_island.PNG',15.50,24.20,530,'hero'],['kitchen','luxury_isometric_coffee_bar_sideboard.PNG',17.30,25.15,310],['kitchen','luxury_isometric_dining_nook.PNG',13.95,25.25,430],['back-room','back_room_storage_shelving.PNG',25.25,22.95,490,'wall'],['back-room','back_room_old_lockers.PNG',27.45,23.25,410,'wall'],['back-room','back_room_service_worktable.PNG',26.10,24.25,510,'hero'],['back-room','back_room_utility_cabinet.PNG',27.35,25.15,310],['back-room','back_room_crate_stack.PNG',24.65,25.20,330]];const rc=new Map;rooms.forEach(([n,x,y,w,h])=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)rc.set(xx+','+yy,n)});const base=document.createElement('div');base.className='floorBase';board.appendChild(base);rooms.forEach(([n,x,y,w,h,tex])=>{const z=document.createElement('div');z.className='floorZone';z.style.left=(x-1)*T+'px';z.style.top=(y-1)*T+'px';z.style.width=w*T+'px';z.style.height=h*T+'px';z.style.backgroundImage=`linear-gradient(#0002,#0002),url('/assets/board-ui/floor-tiles/${tex}')`;board.appendChild(z)});const center=(x,y)=>[(x-.5)*T,(y-.5)*T];for(let y=1;y<=R;y++)for(let x=1;x<=C;x++){const e=document.createElement('i'),n=rc.get(x+','+y),per=x===1||x===C||y===1||y===R;e.className='cell '+(per?'perim ':'')+(n?'room ':'')+(n==='CASINO FLOOR'?'casino ':'');e.style.left=(x-1)*T+'px';e.style.top=(y-1)*T+'px';e.dataset.x=x;e.dataset.y=y;board.appendChild(e)}rooms.forEach(([n,x,y,w,h])=>{const f=document.createElement('i');f.className='roomframe';f.style.left=(x-1)*T+'px';f.style.top=(y-1)*T+'px';f.style.width=w*T+'px';f.style.height=h*T+'px';board.appendChild(f)});const propEls=[];props.forEach(([folder,file,x,y,width,kind])=>{const[cx,cy]=center(x,y),p=document.createElement('div');p.className='prop uprightSprite '+(kind||'');p.dataset.x=x;p.dataset.y=y;p.dataset.file=file;p.style.left=cx+'px';p.style.top=cy+'px';p.style.width=width+'px';const img=document.createElement('img');img.alt='';img.draggable=false;img.loading='lazy';img.src=ROOT+folder+'/'+file;p.appendChild(img);board.appendChild(p);propEls.push(p)});rooms.forEach(([n,x,y,w,h])=>{const l=document.createElement('div');l.className='label uprightUI';l.textContent=n;l.style.left=(x-1+w/2)*T+'px';l.style.top=(y-1+h/2)*T+'px';board.appendChild(l)});function mkPiece(x,y,selected=false){const p=document.createElement('div');p.className='marker uprightUI'+(selected?' selected':'');p.dataset.x=x;p.dataset.y=y;const[cx,cy]=center(x,y);p.style.left=cx+'px';p.style.top=cy+'px';board.appendChild(p);return p}const selected=mkPiece(15,15,true),coord=document.createElement('div');coord.className='coord uprightUI';board.appendChild(coord);let turn=0,zoom=GAME_ZOOM,fit=1,panX=0,panY=0,drag=false,moved=false,startX=0,startY=0,startPanX=0,startPanY=0,gridOn=true,assetsOn=true,labelsOn=false;function projectedSize(angleDeg){const a=angleDeg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),cp=Math.cos(PHI*Math.PI/180),pts=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([x,y])=>[c*x-s*y,(s*x+c*y)*cp]);return[Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))-Math.min(...pts.map(p=>p[1]))]}function calcFit(){const[pw,ph]=projectedSize(-45+turn),availW=Math.max(200,innerWidth-24),availH=Math.max(220,innerHeight-355);fit=Math.min(availW/pw,availH/ph,.72)}function updateSprites(){const angle=-45+turn,a=angle*Math.PI/180;document.querySelectorAll('.uprightUI').forEach(e=>e.style.transform=`translate(-50%,-50%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`);propEls.forEach(p=>{p.style.transform=`translate(-50%,-92%) rotateZ(${-angle}deg) rotateX(${-PHI}deg)`;const x=+p.dataset.x,y=+p.dataset.y,depth=(Math.sin(a)*(x-15)+Math.cos(a)*(y-14));p.style.zIndex=String(2000+Math.round((depth+40)*50)+(p.classList.contains('flat')?-800:0))})}function draw(){const s=fit*zoom;board.style.left=(innerWidth/2-W/2+panX)+'px';const usableCenterY=170+(innerHeight-355)/2;board.style.top=(usableCenterY-H/2+panY)+'px';board.style.transform=`scale(${s}) rotateX(${PHI}deg) rotateZ(${-45+turn}deg)`;updateSprites()}function setMode(z,label){zoom=z;panX=panY=0;calcFit();draw();statusBox.innerHTML=`<b>${label}</b><br>${label==='PLAY VIEW'?'Same accepted giant-board scale. Pan around the furnished rooms.':'Whole 29×27 board overview.'}`}function placeSelected(x,y){const n=rc.get(x+','+y),[cx,cy]=center(x,y);selected.style.left=cx+'px';selected.style.top=cy+'px';coord.style.left=cx+'px';coord.style.top=(cy+90)+'px';coord.textContent=`${x},${y}`;statusBox.innerHTML=`<b>TILE ${x},${y}</b><br>${n||(x===1||x===29||y===1||y===27?'ONE-TILE PERIMETER':'CORRIDOR')}`;updateSprites()}rotL.onclick=()=>{turn=(turn+270)%360;calcFit();draw()};rotR.onclick=()=>{turn=(turn+90)%360;calcFit();draw()};plus.onclick=()=>{zoom=Math.min(10,zoom*1.18);draw()};minus.onclick=()=>{zoom=Math.max(.45,zoom/1.18);draw()};playBtn.onclick=()=>setMode(GAME_ZOOM,'PLAY VIEW');fitBtn.onclick=()=>setMode(1,'FIT VIEW');gridBtn.onclick=()=>{gridOn=!gridOn;document.querySelectorAll('.cell').forEach(e=>e.style.borderColor=gridOn?'':'transparent')};assetBtn.onclick=()=>{assetsOn=!assetsOn;propEls.forEach(e=>e.style.display=assetsOn?'':'none')};labelBtn.onclick=()=>{labelsOn=!labelsOn;document.querySelectorAll('.label').forEach(e=>e.style.display=labelsOn?'block':'none');updateSprites()};stage.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>6)moved=true;if(moved){panX=startPanX+dx;panY=startPanY+dy;draw()}});stage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.classList.contains('cell'))placeSelected(+el.dataset.x,+el.dataset.y)}});stage.addEventListener('pointercancel',()=>drag=false);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',()=>{calcFit();draw()});calcFit();placeSelected(15,15);draw();</script></body></html>
