name: Fix board mobile pan v2
on:
  push:
    paths:
      - '.github/workflows/fix-board-pan-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch board interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/board-lab-tiles.html')
          s=p.read_text()
          old="""const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-710,panY=-550,drag=false,lastX=0,lastY=0;function apply(){world.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+scale+')'}function queuePan(dx,dy){pendingDX+=dx;pendingDY+=dy;if(rafPan)return;rafPan=requestAnimationFrame(()=>{panX+=pendingDX;panY+=pendingDY;pendingDX=0;pendingDY=0;rafPan=0;apply()})}function resetView(){scale=innerWidth<720?.48:.68;panX=-world.offsetWidth/2;panY=-world.offsetHeight/2+15;rotation=0;boardTransform();updateLabelRotation();compass.style.transform='rotate(0deg)';apply()}zoomIn.onclick=()=>{scale=Math.min(1.55,scale+.1);apply()};zoomOut.onclick=()=>{scale=Math.max(.42,scale-.1);apply()};reset.onclick=resetView;stage.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag=true;dragMoved=false;dragStartX=lastX=e.clientX;dragStartY=lastY=e.clientY;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}};stage.onpointermove=e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(!dragMoved&&Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>5)dragMoved=true;lastX=e.clientX;lastY=e.clientY;queuePan(dx,dy)};const endDrag=e=>{if(!drag)return;drag=false;stage.classList.remove('dragging');try{if(e&&stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId)}catch(_){}};stage.onpointerup=endDrag;stage.onpointercancel=endDrag;stage.onlostpointercapture=()=>{drag=false;stage.classList.remove('dragging')};stage.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopPropagation();dragMoved=false}},true);stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.42,Math.min(1.55,scale+(e.deltaY<0?.08:-.08)));apply()},{passive:false});"""
          new="""const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-710,panY=-550,drag=false,dragMoved=false,activePointer=null,startX=0,startY=0,startPanX=0,startPanY=0;function apply(){world.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+scale+')'}function resetView(){scale=innerWidth<720?.48:.68;panX=-world.offsetWidth/2;panY=-world.offsetHeight/2+15;rotation=0;boardTransform();updateLabelRotation();compass.style.transform='rotate(0deg)';apply()}zoomIn.onclick=()=>{scale=Math.min(1.55,scale+.1);apply()};zoomOut.onclick=()=>{scale=Math.max(.42,scale-.1);apply()};reset.onclick=resetView;stage.onpointerdown=e=>{if(activePointer!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();activePointer=e.pointerId;drag=true;dragMoved=false;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}};stage.onpointermove=e=>{if(!drag||e.pointerId!==activePointer)return;e.preventDefault();const dx=e.clientX-startX,dy=e.clientY-startY;if(!dragMoved&&Math.hypot(dx,dy)>4)dragMoved=true;panX=startPanX+dx;panY=startPanY+dy;apply()};const endDrag=e=>{if(!drag||e.pointerId!==activePointer)return;e.preventDefault();drag=false;stage.classList.remove('dragging');try{if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId)}catch(_){}activePointer=null;setTimeout(()=>{dragMoved=false},0)};stage.onpointerup=endDrag;stage.onpointercancel=endDrag;stage.onlostpointercapture=e=>{if(e.pointerId===activePointer){drag=false;activePointer=null;stage.classList.remove('dragging')}};stage.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopImmediatePropagation()}},true);stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.42,Math.min(1.55,scale+(e.deltaY<0?.08:-.08)));apply()},{passive:false});"""
          if old not in s:
              raise SystemExit('Old pan block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/board-lab-tiles.html
          git commit -m "Fix board drag state and mobile pan" || exit 0
          git push
