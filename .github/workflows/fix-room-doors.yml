name: Fix room doorway routing
on:
  push:
    paths:
      - '.github/workflows/fix-room-doors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch room doors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='worker.js';
          let s=fs.readFileSync(p,'utf8');
          const doors="const ROOM_DOORS={vault:{A:[5,8],B:[8,5]},control:{A:[5,19],B:[8,16]},high:{A:[5,24],B:[8,27]},office:{A:[13,5],B:[19,5]},casino:{A:[16,13],B:[16,19]},after:{A:[16,24],B:[19,27]},workshop:{A:[27,8],B:[24,5]},kitchen:{A:[24,16],B:[27,13]},back:{A:[24,27],B:[27,24]}};";
          s=s.replace(/const ROOM_DOORS=\{[^\n]+\};/,doors);
          s=s.replace(/activeDoor\(room\)\{[^\n]+?\}\nphysicalNeighbors/,"activeDoor(room){if(room==='casino')return null;const d=ROOM_DOORS[room]?.[this.data.doorSide||'A'];return d?floorId(d[0],d[1]):null}\nphysicalNeighbors");
          s=s.replace(/neighbors\(pos\)\{let out=this\.physicalNeighbors\(pos\);if\(isRoom\(pos\)\)\{const door=this\.activeDoor\(pos\);out=out\.filter\(x=>x===door\)\}else if\(isFloor\(pos\)\)\{out=out\.filter\(next=>!isRoom\(next\)\|\|this\.activeDoor\(next\)===pos\)\}/,"neighbors(pos){let out=this.physicalNeighbors(pos);if(isRoom(pos)&&pos!=='casino'){const door=this.activeDoor(pos);out=out.filter(x=>x===door)}else if(isFloor(pos)){out=out.filter(next=>!isRoom(next)||next==='casino'||this.activeDoor(next)===pos)}");
          if(!s.includes(doors)) throw new Error('Door map patch failed');
          if(!s.includes("if(room==='casino')return null")) throw new Error('Lobby exemption patch failed');
          fs.writeFileSync(p,s);
          NODE
      - name: Commit patch
        run: |
          git config user.name "Full Tilt Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Correct room doors to reachable interior-facing thresholds"
          git push
