name: Fix board mobile pan
on:
  push:
    paths:
      - '.github/workflows/fix-board-mobile-pan.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile pan interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/board-lab-tiles.html')
          s=p.read_text()
          s=s.replace('.stage{position:fixed;inset:0;touch-action:none;cursor:grab}', '.stage{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;cursor:grab}.stage.dragging{cursor:grabbing}.world{will-change:transform;backface-visibility:hidden;transform:translate3d(0,0,0)}')
          # Remove the mobile-only world size override; it fights the large board geometry.
          s=s.replace('@media(max-width:720px){.world{width:1020px;height:820px}.shell{left:65px;top:80px}', '@media(max-width:720px){.shell{left:110px;top:95px}')
          old="const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-world.offsetWidth/2,panY=-world.offsetHeight/2+15,drag=false,lastX=0,lastY=0;"
          # Current file may still initialize with literal dimensions; replace more flexibly below.
          if old not in s:
              old="const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-580,panY=-450,drag=false,lastX=0,lastY=0;"
          new="const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=.82,panX=-world.offsetWidth/2,panY=-world.offsetHeight/2+15,drag=false,lastX=0,lastY=0,dragStartX=0,dragStartY=0,dragMoved=false,rafPan=0,pendingDX=0,pendingDY=0;"
          s=s.replace(old,new)
          old2="function apply(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')'}"
          new2="function apply(){world.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+scale+')'}function queuePan(dx,dy){pendingDX+=dx;pendingDY+=dy;if(rafPan)return;rafPan=requestAnimationFrame(()=>{panX+=pendingDX;panY+=pendingDY;pendingDX=0;pendingDY=0;rafPan=0;apply()})}"
          s=s.replace(old2,new2)
          old3="stage.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!drag)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply()};stage.onpointerup=()=>drag=false;"
          new3="stage.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag=true;dragMoved=false;dragStartX=lastX=e.clientX;dragStartY=lastY=e.clientY;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}};stage.onpointermove=e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(!dragMoved&&Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>5)dragMoved=true;lastX=e.clientX;lastY=e.clientY;queuePan(dx,dy)};const endDrag=e=>{if(!drag)return;drag=false;stage.classList.remove('dragging');try{if(e&&stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId)}catch(_){}};stage.onpointerup=endDrag;stage.onpointercancel=endDrag;stage.onlostpointercapture=()=>{drag=false;stage.classList.remove('dragging')};stage.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopPropagation();dragMoved=false}},true);"
          if old3 not in s:
              raise SystemExit('Pan handler signature not found; refusing blind patch')
          s=s.replace(old3,new3)
          # Prevent resize/orientation noise from snapping the board during active touch gestures.
          s=s.replace("window.addEventListener('resize',()=>{place();placeTestPieces();resetView()});", "let resizeTimer=0;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(drag)return;place();placeTestPieces();},180)});")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/board-lab-tiles.html
          git commit -m "Fix mobile board pan stutter and snapback" || exit 0
          git push
