name: Apply v0.2 Evidence and Accusation Rules

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-v02-evidence-accusations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch worker and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'Missing patch target: {label}')
              return s.replace(old, new, 1)

          p=Path('worker.js'); s=p.read_text()

          s=rep(s,
          "async load(){if(!this.data)this.data=await this.state.storage.get('match')||null;if(this.data){if(!this.data.doorSide)this.data.doorSide='A';if(this.data.passages==null)this.data.passages=true;if(!this.data.lights)this.data.lights={side:null,turnsRemaining:0};if(!this.data.lightPulse)this.data.lightPulse=null}return this.data}",
          "async load(){if(!this.data)this.data=await this.state.storage.get('match')||null;if(this.data){if(!this.data.doorSide)this.data.doorSide='A';if(this.data.passages==null)this.data.passages=true;if(!this.data.lights)this.data.lights={side:null,turnsRemaining:0};if(!this.data.lightPulse)this.data.lightPulse=null;if(!this.data.pendingAccusations)this.data.pendingAccusations=[];for(const p of this.data.players||[]){if(!p.evidenceVariants)p.evidenceVariants={};if(p.pendingAccusation==null)p.pendingAccusation=false}}return this.data}", 'load migrations')

          s=rep(s,
          "knowledge(p){return new Set([...Object.values(p.found||{}),...(this.data.publicClues||[])]).size}\nfresh(p){return[...new Set(Object.values(p.found||{}))].filter(c=>!this.data.publicClues.includes(c))}\nallFound(p){return[...new Set(Object.values(p.found||{}))]}\ntestimonyChoices(p){const fresh=this.fresh(p);return{mode:fresh.length?'NEW':this.allFound(p).length?'DUPLICATE':'NONE',choices:fresh.length?fresh:this.allFound(p)}}",
          "knowledge(p){return new Set([...Object.values(p.found||{}).map(x=>typeof x==='string'?x:x?.text).filter(Boolean),...(this.data.publicClues||[])]).size}\nallFound(p){return[...new Set(Object.values(p.found||{}).map(x=>typeof x==='string'?x:x?.text).filter(Boolean))]}\ntestimonyChoices(p){const choices=this.allFound(p);return{mode:choices.length?'EVIDENCE':'NONE',choices}}",
          'testimony choices')

          start=s.index('makeEvidence(){')
          end=s.index('\ncaseMatchesClue(', start)
          new_make="""makeEvidence(){const sol=this.data.solution,sBad=shuffle(SUSPECTS.filter(x=>x!==sol.killer)),wBad=shuffle(WEAPONS.filter(x=>x!==sol.weapon)),rBad=shuffle(ROOMS.filter(x=>x!==sol.room));const defs=[{text:`The Killer is NOT ${sBad.slice(0,4).join(', ')}.`,test:c=>!sBad.slice(0,4).includes(c.killer)},{text:`The Killer is one of: ${shuffle([sol.killer,...sBad.slice(4,7)]).join(', ')}.`,test:c=>[sol.killer,...sBad.slice(4,7)].includes(c.killer)},{text:`The Killer is NOT ${sBad.slice(4,7).join(', ')}.`,test:c=>!sBad.slice(4,7).includes(c.killer)},{text:`The murder weapon was NOT ${wBad.slice(0,4).join(', ')}.`,test:c=>!wBad.slice(0,4).includes(c.weapon)},{text:`The weapon is one of: ${shuffle([sol.weapon,...wBad.slice(4,7)]).join(', ')}.`,test:c=>[sol.weapon,...wBad.slice(4,7)].includes(c.weapon)},{text:`The murder weapon was NOT ${wBad.slice(4,8).join(', ')}.`,test:c=>!wBad.slice(4,8).includes(c.weapon)},{text:`The crime did NOT happen in ${rBad.slice(0,4).join(', ')}.`,test:c=>!rBad.slice(0,4).includes(c.room)},{text:`The crime did NOT happen in ${rBad.slice(4,7).join(', ')}.`,test:c=>!rBad.slice(4,7).includes(c.room)}];const left=this.allCases().filter(c=>defs.every(d=>d.test(c)));if(left.length!==1||left[0].killer!==sol.killer||left[0].weapon!==sol.weapon||left[0].room!==sol.room)throw new Error('Evidence validation failed');return Object.fromEntries(SEARCH_ROOM_IDS.map((r,i)=>{const base=defs[i].text;return[r,{domain:i+1,A:{id:`D${i+1}A`,text:base},B:{id:`D${i+1}B`,text:base}}]}))}"""
          s=s[:start]+new_make+s[end:]

          s=rep(s,
          "botCandidates(p){const clues=[...new Set([...Object.values(p.found||{}),...(this.data.publicClues||[])])],hand=p.hand||[];return this.allCases().filter(c=>{if(p.role==='KILLER'&&c.killer!==p.character)return false;if(hand.some(h=>(h.type==='SUSPECT'&&c.killer===h.name)||(h.type==='WEAPON'&&c.weapon===h.name)||(h.type==='ROOM'&&c.room===h.name)))return false;return clues.every(x=>this.caseMatchesClue(x,c))})}",
          "botCandidates(p){const clues=[...new Set([...Object.values(p.found||{}).map(x=>typeof x==='string'?x:x?.text).filter(Boolean),...(this.data.publicClues||[])])],hand=p.role==='KILLER'?[]:(p.hand||[]);return this.allCases().filter(c=>{if(p.role==='KILLER'&&c.killer!==p.character)return false;if(hand.some(h=>(h.type==='SUSPECT'&&c.killer===h.name)||(h.type==='WEAPON'&&c.weapon===h.name)||(h.type==='ROOM'&&c.room===h.name)))return false;return clues.every(x=>this.caseMatchesClue(x,c))})}", 'killer hidden hand reasoning')

          s=rep(s,
          "botSearch(p){if(!p.room||p.room==='casino')return;const n=d6();if(n===1||n===6){const clue=this.data.clueMap[p.room],isNew=!p.found[p.room];p.found[p.room]=clue;if(isNew&&p.accuseLocked)p.accuseLocked=false}this.touch()}",
          "botSearch(p){if(!p.room||p.room==='casino'||p.found?.[p.room])return;const n=d6();if(n===1||n===6){const variant=Math.random()<.5?'A':'B',clue=this.data.clueMap[p.room][variant];p.evidenceVariants=p.evidenceVariants||{};p.evidenceVariants[p.room]=variant;p.found[p.room]=clue}this.touch()}", 'bot A/B search')

          # Bots no longer insta-win outside conferences; they can file from Casino Floor in later passes.
          s=rep(s,
          "botTurn(p){const n=d6(),reachable=this.reachable(p.position,n,p.id),target=this.botDestination(p,reachable);if(target){p.position=target;p.room=isRoom(target)?target:null}this.touch();if(this.botAccuseIfCertain(p))return;if(p.room&&p.room!=='casino')this.botSearch(p);if(this.botAccuseIfCertain(p))return}",
          "botTurn(p){const n=d6(),reachable=this.reachable(p.position,n,p.id),target=this.botDestination(p,reachable);if(target){p.position=target;p.room=isRoom(target)?target:null}this.touch();if(p.room&&p.room!=='casino')this.botSearch(p)}", 'bot instant accusations')

          s=rep(s,
          "const withFresh=candidates.filter(x=>this.fresh(x).length);const pool=withFresh.length&&Math.random()<.65?withFresh:candidates;",
          "const pool=candidates;", 'bot vote does not peek at unpublished evidence')

          # New matches: exactly three genuine cards each, Killer hand remains server-side but hidden in view.
          old="this.data.players.forEach((p,i)=>{p.character=chars[i];p.role=i===ki?'KILLER':'INVESTIGATOR';p.position=START_POSITIONS[i%START_POSITIONS.length];p.room=null;p.hand=[];p.found={};p.accuseLocked=false;p.revealedHand=false;p.voteTarget=null});deck.forEach((c,i)=>this.data.players[i%this.data.players.length].hand.push(c));"
          new="this.data.players.forEach((p,i)=>{p.character=chars[i];p.role=i===ki?'KILLER':'INVESTIGATOR';p.position=START_POSITIONS[i%START_POSITIONS.length];p.room=null;p.hand=[];p.found={};p.evidenceVariants={};p.pendingAccusation=false;p.revealedHand=false;p.voteTarget=null});this.data.players.forEach(p=>{p.hand=deck.splice(0,3)});this.data.pendingAccusations=[];"
          s=rep(s,old,new,'three card hands')

          old="async search(p){if(this.data.phase==='MOVE'||this.data.acted)return json({error:'Cannot search now'},409);if(!p.room)return json({error:'You must be inside a room to search'},409);if(p.room==='casino')return json({error:'Casino Floor has no evidence'},409);const n=d6();this.data.acted=true;let clue=null,isNew=false;if(n===1||n===6){clue=this.data.clueMap[p.room];isNew=!p.found[p.room];p.found[p.room]=clue;if(isNew&&p.accuseLocked)p.accuseLocked=false}this.touch();await this.save();return json({ok:true,roll:n,success:!!clue,isNew,clue,state:this.view(p)})}"
          new="async search(p){if(this.data.phase==='MOVE'||this.data.acted)return json({error:'Cannot search now'},409);if(!p.room)return json({error:'You must be inside a room to search'},409);if(p.room==='casino')return json({error:'Casino Floor has no evidence'},409);if(p.found?.[p.room])return json({error:'You already recovered this room evidence'},409);const n=d6();this.data.acted=true;let clue=null,variant=null;if(n===1||n===6){variant=Math.random()<.5?'A':'B';clue=this.data.clueMap[p.room][variant];p.evidenceVariants=p.evidenceVariants||{};p.evidenceVariants[p.room]=variant;p.found[p.room]=clue}this.touch();await this.save();return json({ok:true,roll:n,success:!!clue,isNew:!!clue,clue:clue?.text||null,variant,state:this.view(p)})}"
          s=rep(s,old,new,'player A/B search')

          # Replace immediate accusation with private queue filing from Casino Floor.
          a=s.index('async accuse(p,b){')
          b=s.index('\nasync end(p)',a)
          s=s[:a]+"""async accuse(p,b){if(p.room!=='casino')return json({error:'Accusations must be filed from the Casino Floor'},409);if(this.data.phase==='MOVE'||this.data.acted)return json({error:'Cannot file an accusation now'},409);if(p.pendingAccusation)return json({error:'You already have an accusation pending for the next Case Conference'},409);const suspect=p.role==='KILLER'?p.character:String(b.suspect||''),weapon=String(b.weapon||''),room=String(b.room||'');if(!SUSPECTS.includes(suspect)||!WEAPONS.includes(weapon)||!ROOMS.includes(room))return json({error:'Invalid accusation'},400);const filing={id:id(8),playerId:p.id,suspect,weapon,room,submittedAt:Date.now(),order:(this.data.pendingAccusations?.length||0)+1};this.data.pendingAccusations=this.data.pendingAccusations||[];this.data.pendingAccusations.push(filing);p.pendingAccusation=true;this.data.acted=true;this.touch();await this.save();return json({ok:true,filed:true,privateMessage:'ACCUSATION FILED. It will resolve at the next Case Conference.',state:this.view(p)})}\nresolveQueuedAccusations(){const q=[...(this.data.pendingAccusations||[])].sort((a,b)=>a.submittedAt-b.submittedAt);this.data.pendingAccusations=[];for(const filing of q){const p=this.data.players.find(x=>x.id===filing.playerId);if(!p)continue;p.pendingAccusation=false;const correct=filing.suspect===this.data.solution.killer&&filing.weapon===this.data.solution.weapon&&filing.room===this.data.solution.room;if(correct){this.data.status='FINISHED';this.data.deadline=null;this.data.finalSolution=this.data.solution;this.event(p.role==='KILLER'?`${p.name} reconstructed the crime, covered their tracks, and won.`:`${p.name} solved the case and won.`,'SYSTEM');return p}p.revealedHand=true;const x=`${p.name}: ${(p.hand||[]).map(c=>`${c.type}: ${c.name}`).join(' · ')||'EMPTY HAND'}`;if(!this.data.publicHands.includes(x))this.data.publicHands.push(x);this.event(`${p.name}'s accusation was WRONG. Their entire Case Hand is now public.`,'SYSTEM')}return null}"""+s[b:]

          # Vote resolves first, then queued accusations, then testimony.
          needle="if(!witness)witness=this.data.players[Math.floor(Math.random()*this.data.players.length)];const t=this.testimonyChoices(witness);"
          repl="if(!witness)witness=this.data.players[Math.floor(Math.random()*this.data.players.length)];this.data.conference.witnessId=witness.id;const winner=this.resolveQueuedAccusations();if(winner){await this.save();return}const t=this.testimonyChoices(witness);"
          s=rep(s,needle,repl,'accusations before testimony')

          s=rep(s,
          "this.data.conference.testimonyMode=t.mode;this.data.deadline=Date.now()+TESTIMONY_MS;this.data.conference.deadline=this.data.deadline;this.event(t.mode==='NEW'?`🔎 ${witness.name} must reveal ONE piece of unseen evidence.`:`🔎 ${witness.name} has no unseen evidence and must repeat a previous disclosure.`,'SYSTEM');",
          "this.data.conference.testimonyMode=t.mode;this.data.deadline=Date.now()+TESTIMONY_MS;this.data.conference.deadline=this.data.deadline;this.event(`🔎 ${witness.name} must reveal ONE piece of evidence.`,'SYSTEM');", 'neutral testimony prompt')

          s=rep(s,
          "if(!t.choices.includes(clue))return json({error:t.mode==='NEW'?'Choose one of your unpublished evidence clues':'Choose one of your previously disclosed evidence clues'},400);this.publishTestimony(p,clue,t.mode);",
          "if(!t.choices.includes(clue))return json({error:'Choose one of your evidence clues'},400);this.publishTestimony(p,clue);", 'testimony validation')

          start=s.index('publishTestimony(')
          # first occurrence is call in testify; find definition specifically
          start=s.index('publishTestimony(p,clue,mode){')
          end=s.index('\nasync autoTestify()',start)
          s=s[:start]+"publishTestimony(p,clue){if(!this.data.publicClues.includes(clue))this.data.publicClues.push(clue);this.event(`📌 ${p.name} revealed verified evidence.`,'SYSTEM')}"+s[end:]
          s=s.replace('this.publishTestimony(witness,clue,t.mode);','this.publishTestimony(witness,clue);')

          # View: hide Killer hand, expose pending status, never expose source room via found keys in UI payload.
          old="hand:p.hand||[],found:p.found||{},knowledge:this.knowledge(p),accuseLocked:!!p.accuseLocked,killerKnowledge:p.role==='KILLER'?{killer:p.character}:null"
          new="hand:p.role==='KILLER'&&!p.revealedHand?(p.hand||[]).map(()=>({type:'HIDDEN',name:'FACE DOWN'})):(p.hand||[]),found:Object.fromEntries(Object.entries(p.found||{}).map(([room,x])=>[x?.id||room,{id:x?.id||room,text:typeof x==='string'?x:x?.text}])),evidenceCount:Object.keys(p.found||{}).length,knowledge:this.knowledge(p),pendingAccusation:!!p.pendingAccusation,killerKnowledge:p.role==='KILLER'?{killer:p.character}:null"
          s=rep(s,old,new,'private view')

          p.write_text(s)

          # UI copy and behavior.
          p=Path('public/game.js'); s=p.read_text()
          s=s.replace("['casino','CASINO FLOOR','The heart of Headquarters. No evidence is hidden here.']","['casino','CASINO FLOOR','The heart of Headquarters. No evidence is hidden here. Secret accusations are filed here.']")
          s=s.replace("Vote for who must reveal NEW evidence.","Vote for who must testify. Pay attention — the game will not tell you whether their evidence is new.")
          s=s.replace("must reveal one unpublished clue.","must reveal one piece of evidence.")
          s=s.replace("'You may search this room, use Control Room systems, accuse, or end your turn.'","p.room==='casino'?'Casino Floor: you may secretly file an accusation or end your turn.':'You may search this room, use its special system, or end your turn.'")
          old="const found=Object.entries(p.found||{});$('evidenceCount').textContent=`${found.length} / 8`;$('evidence').innerHTML=found.map(([r,c])=>`<div class=\"clue\">${c}<em>TRUE SOURCE: ${roomName(r)} · PUBLIC DOES NOT SEE THIS</em></div>`).join('')||'<em>No evidence recovered.</em>';"
          new="const found=Object.values(p.found||{});$('evidenceCount').textContent=`${p.evidenceCount??found.length} / 8`;$('evidence').innerHTML=found.map(c=>`<div class=\"clue\">${c.text||c}</div>`).join('')||'<em>No evidence recovered.</em>';"
          s=rep(s,old,new,'hide evidence source in UI')
          s=s.replace("const accuseOK=turn&&p.knowledge>=3&&!p.accuseLocked&&!busy;","const accuseOK=turn&&p.room==='casino'&&!state.acted&&!p.pendingAccusation&&!busy;")
          s=s.replace("$('accuseBtn').textContent=accuseOK?(p.role==='KILLER'?'🩸 COVER YOUR TRACKS':'⚠ MAKE ACCUSATION'):`🔒 ACCUSATION (${p.knowledge}/3)`;","$('accuseBtn').textContent=p.pendingAccusation?'✓ ACCUSATION FILED':accuseOK?(p.role==='KILLER'?'🩸 FILE COVER YOUR TRACKS':'⚠ FILE ACCUSATION'):'🔒 FILE AT CASINO FLOOR';")
          s=s.replace("'Vote for ONE player. You do not know whether they actually hold unpublished evidence.'","'Vote for ONE player to testify. The game will not tell you whether what they reveal has already been seen.'")
          s=s.replace("'The selected witness must choose ONE unpublished clue. The clue becomes public, but the room it came from remains secret.'","'The selected witness chooses ONE piece of evidence. Its source room remains secret. Repeats are not labeled.'")
          s=s.replace("||'<div class=\"clue\">No unpublished evidence available.</div>'","||'<div class=\"clue\">No evidence available.</div>'")
          s=s.replace("act('accuse',b,d=>result(d.correct?`CASE CLOSED. ${d.winner} wins. ${d.solution.killer} · ${d.solution.weapon} · ${d.solution.room}`:`WRONG. Penalty roll ${d.penalty}: hand ${d.outcome.toLowerCase()}.`))","act('accuse',b,d=>result(d.privateMessage||'ACCUSATION FILED.'))")
          p.write_text(s)
          PY
      - name: Sanity check JavaScript
        run: |
          node --check worker.js
          node --check public/game.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js public/game.js
          git diff --cached --quiet && exit 0
          git commit -m 'Implement v0.2 evidence and secret accusation flow'
          git push
