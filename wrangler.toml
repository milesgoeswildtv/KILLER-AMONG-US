name = "killer-among-us"
main = "worker.js"
compatibility_date = "2026-09-05"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "MATCHES", class_name = "MatchLobby" }
]

[[migrations]]
tag = "v1"
new_classes = ["MatchLobby"]
